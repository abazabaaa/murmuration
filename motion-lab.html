<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bird motion · Murmuration</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edeae1;color:#282b28;font:15px/1.5 system-ui}header{padding:24px 5vw}h1{font-size:28px;font-weight:500;margin:0}a{color:inherit}main{display:grid;grid-template-columns:1fr 310px;gap:32px;padding:0 5vw 30px}canvas{width:100%;height:65vh;background:#e2dfd5;border-radius:12px}aside{padding:16px 0}label{display:block;margin:16px 0}select,button{font:inherit;padding:8px;border:1px solid #aaa;background:#f5f2e9;border-radius:6px}select{width:100%}input{width:100%}small{display:block;color:#64675e}#readout{font-variant-numeric:tabular-nums}@media(max-width:750px){main{grid-template-columns:1fr}canvas{height:45vh}aside{padding:0}}
</style><header><a href="murmuration.html">← Flock</a><h1>Bird motion</h1><small>Explore the fitted poses from every angle.</small></header><main><canvas id="bird"></canvas><aside>
<label>Bird<select id="species"><option value="starling">Starling</option><option value="falcon">Peregrine falcon</option></select></label>
<label>Motion<select id="clip"></select></label><label>View<select id="view"><option value="quarter">Three quarter</option><option value="top">Above</option><option value="front">Front</option><option value="side">Side</option></select></label>
<button id="play">Pause</button><label>Slow motion<input id="speed" type="range" min="0.05" max="1" step="0.05" value="0.15"></label><label>Phase<input id="phase" type="range" min="0" max="1" step="0.001" value="0"></label><label>Bank<input id="bank" type="range" min="-70" max="70" value="0"></label><p id="readout"></p><p id="evidence"></p><small>Glide and bound are separate poses. Joint paths and transition durations are estimates; these are fitted models, not captured flight.</small>
</aside></main><script src="motion/motion-data.js"></script><script src="motion/motion.js"></script><script>
const $=id=>document.getElementById(id), M=MurmurationMotion, canvas=$('bird'),ctx=canvas.getContext('2d');
let playing=true,t=0,last=0,verts=new Float32Array(948);
function options(){const species=$('species').value,model=M.data.species[species];$('clip').innerHTML='';for(const name of Object.keys(model.clips)){const opt=document.createElement('option');opt.value=name;opt.textContent=name.replaceAll('_',' ');$('clip').append(opt)}t=0;$('evidence').innerHTML=species==='starling'?'Stroke height fitted to a reported 28 cm excursion at 12 m/s in one starling. <a href="https://doi.org/10.1371/journal.pone.0080086">Study</a>.':'Dive shapes informed by photographs and the <a href="https://doi.org/10.1371/journal.pone.0086506">Ponitz et al. study</a> (22.5 m/s observed maximum).';}
$('species').onchange=options;$('clip').onchange=()=>t=0;$('phase').oninput=()=>{t=+$('phase').value;playing=false;$('play').textContent='Play'};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};options();
function draw(ms){const dt=Math.min((ms-last)/1000,.05);last=ms;const species=$('species').value,clip=$('clip').value,model=M.data.species[species];if(playing)t=(t+dt*+$('speed').value*(clip==='flap'?(species==='starling'?12:4.5):.5))%1;$('phase').value=t;
const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);M.sample(species,clip,t,verts);
const view=$('view').value,bank=+$('bank').value*Math.PI/180,c=Math.cos(bank),s=Math.sin(bank),scale=Math.min(rect.width*.38,rect.height*.55),points=[];
for(let j=0;j<verts.length;j+=3){const a=verts[j],w=verts[j+1]*c-verts[j+2]*s,h=verts[j+1]*s+verts[j+2]*c;let x,y;if(view==='top'){x=w;y=-a}else if(view==='front'){x=w;y=-h}else if(view==='side'){x=a;y=-h}else{x=.85*w+.5*a;y=-.85*h+.25*w-.42*a}points.push([rect.width/2+x*scale,rect.height*.48+y*scale]);}
const path=new Path2D();for(let [a,b,c] of model.faces.near){if((points[b][0]-points[a][0])*(points[c][1]-points[a][1])-(points[b][1]-points[a][1])*(points[c][0]-points[a][0])<0)[b,c]=[c,b];path.moveTo(...points[a]);path.lineTo(...points[b]);path.lineTo(...points[c]);path.closePath()}ctx.fillStyle='#283c3a';ctx.fill(path);
let min=Infinity,max=-Infinity;for(let j=1;j<verts.length;j+=3){min=Math.min(min,verts[j]);max=Math.max(max,verts[j])}$('readout').textContent=`Span in this pose: ${((max-min)*model.halfSpanM*100).toFixed(1)} cm · phase ${t.toFixed(2)}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
