<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmuration</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a1a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: fixed; left: clamp(16px, 3vw, 34px); bottom: clamp(14px, 2.6vh, 28px);
    font: 500 11px/1.6 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: rgba(255, 226, 200, .7);
    pointer-events: none; user-select: none; transition: opacity 2.4s ease;
  }
  .hud b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .34em; color: rgba(255, 238, 220, .95); }
  .hud.dim { opacity: .38; }
  #dbg { position: fixed; top: 8px; left: 8px; margin: 0; font: 11px/1.4 ui-monospace, monospace; color: #fff; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud"><b>Murmuration</b><span id="hint"></span></div>
<script>
(() => {
'use strict';
// Flocking model with the observables of Cavagna et al., "Scale-free correlations in
// starling flocks", PNAS 107:11865 (2010).  Equation numbers below refer to that paper.
//   Eq 1   polarization        Φ = |(1/N) Σ v_i/|v_i||
//   Eq 2   velocity fluctuation u_i = v_i − (1/N) Σ v_k          (Eq 3: Σ u_i = 0)
//   Eq 4   correlation         C(r) = (1/c0) Σ_ij u_i·u_j δ(r−r_ij) / Σ_ij δ(r−r_ij), c0 = (1/N) Σ |u_i|² so C(0)=1
//   Eq 5   correlation length  C(ξ) = 0  (a zero must exist: Eq 14 says ∫ numerator dr = |Σ u_i|² − N c0 = −N c0 < 0)
//   Eq 15  speed correlation   same as Eq 4 with φ_i = |v_i| − (1/N) Σ |v_k|   (Eq 16)
//   result ξ ≈ 0.35 L (orientation), ξ_sp ≈ 0.36 L (speed), Φ = 0.96 ± 0.03; interaction is topological (~7 birds)
// Scale-free here means ξ ∝ L and C(r) keeping one shape in r/L. Two things in the model produce it:
//   1. nothing restores a single bird's heading or speed to a preferred value: steering, levelling
//      and the speed hold act on flock means, so a fluctuation can only relax through the neighbours;
//   2. the behavioural noise is persistent (NOISE_TAU) and alignment is stiff (W_ALI), so the long
//      wavelengths carry the fluctuation (white noise leaves it in a neighbour-sized blob).
// Measured, undisturbed (?calm), N = 100…1600: L = 17…39 m, ξ/L = 0.33–0.38, ξ_sp/L = 0.32–0.36.
// World unit: 1 u = 0.5 m, so CRUISE 23 u/s ≈ 11.5 m/s (paper Fig 1C), separation 5 u ≈ 2.5 m.
// Press C to toggle the correlation panel (?stats opens it; ?debug adds the frame counter).

const params = new URLSearchParams(location.search);
// ?local (experimental): a flock held together by local rules, measured against wild starling flocks in FLOCK.md.
// Each bird's neighbours are the nearest in each octant (spatially balanced, after Camperi et al. 2012, so groups
// cannot close off), cohesion is twice as strong vertically, separation reaches 1.5 m, the pull toward the flock's
// centre is horizontal only and 10 times weaker, the rejoin rule is off, all birds turn together, the behavioural
// noise is faster and stronger (memory 0.25 s), and the per-bird screen backstop is off. Any of these can still be
// overridden in the URL.
if (params.has('local')) for (const [k, v] of Object.entries({ balanced: 1, geom: 2, gh: .1, gv: 0, gx: 0, rj: 100, tlag: 0,
  rs: 3, noise: 2.5, tau: .25, kappa: 2, backstop: 0 })) if (!params.has(k)) params.set(k, v);
// The default view is a camera on the ground: 5,000 birds at life size, a 1/60 s exposure, sensor grain and a camera
// that pans to follow the flock. ?classic restores the earlier defaults (400 birds drawn twice life size, clean frames,
// fixed camera); ?life=0, ?shutter=0, ?grain=0 and ?follow=0 turn single parts off.
const CLASSIC = params.has('classic');
const opt = k => params.has(k) ? params.get(k) !== '0' : !CLASSIC;   // on by default, off under ?classic or ?k=0
const N = Math.min(10000, Math.max(20, +params.get('n') || (CLASSIC ? 400 : 5000)));
const BALANCED = params.get('balanced') === '1', BACKSTOP = params.get('backstop') !== '0';
const K = BALANCED ? 8 : 7;                    // 7 nearest by default; at most 8 octant neighbours experimentally
const TAU = Math.PI * 2;

const rng = s => () => {                       // mulberry32
  s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const rand = rng(params.has('seed') ? +params.get('seed') : (Math.random() * 4294967296) >>> 0);
let gSpare = NaN;
const gauss = () => {                          // Box–Muller, N(0,1)
  if (!Number.isNaN(gSpare)) { const v = gSpare; gSpare = NaN; return v; }
  let u1 = rand(); while (u1 <= 1e-12) u1 = rand();
  const r = Math.sqrt(-2 * Math.log(u1)), a = TAU * rand();
  gSpare = r * Math.sin(a); return r * Math.cos(a);
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const sky = document.createElement('canvas');
const sctx = sky.getContext('2d');
// Photographic backdrop: murmuration-sky.jpg is an evening panorama (Poly Haven "Scythian Tombs 2",
// CC0) reprojected for this camera, with the horizon at 80 % of its height and a 46° vertical field
// of view. Until it loads, if it is missing, or with ?painted, the painted sky below is used.
const skyImg = document.createElement('img');
let skyReady = false, vig = null;              // vig: the vignette, apart from the sky only under ?follow
if (!params.has('painted')) {
  skyImg.onload = () => { skyReady = true; paintSky(); fresh = true; };
  skyImg.src = 'murmuration-sky.jpg';
}

// ---------------------------------------------------------------- camera
// World: x right, y up, z away from the viewer. The camera stands on the ground looking
// at the flock, pitched up so the horizon sits low in the frame.
const CAM_H = 2;
const ZMIN = 75, ZMAX = 200;
let W, H, dpr, f, cx, cy, HORIZON, ct, st, UM, VT, VB, sizeK;
// ?follow: the camera pans to follow the flock, as whoever films a murmuration does (real_calm: about 1.9 px a frame).
// Only the view turns: the physics keeps its fixed frame, so framing, waypoints and the falcon's entries are computed
// as without it (except that big flocks may then roam the full width, WAY_X). The pan is a yaw alone: the sky
// photograph is wider than the window (about 350 px each side at 1200x793) but no taller, so it can slide sideways but
// not tilt. Sliding it stands in for a rectilinear yaw; rows stay straight and the far edges are off by a few per cent
// at 10 degrees. The camera eases toward the flock centre's bearing, critically damped (FOLLOW_W, rad/s).
const FOLLOW = opt('follow') && !params.has('painted'), FOLLOW_W = 1.2, SKY_PX = [3840, 1600];   // murmuration-sky.jpg
let yaw = 0, yawV = 0, yawMax = 0, yawC = 1, yawS = 0, skySpare = 0;

function layout() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = sky.width = Math.round(W * dpr);
  canvas.height = sky.height = Math.round(H * dpr);
  f = Math.min((H / 2) / Math.tan(23 * Math.PI / 180), (W / 2) / Math.tan(21 * Math.PI / 180));
  cx = W / 2; cy = H / 2;
  HORIZON = 0.8 * H;
  const pitch = Math.atan((HORIZON - cy) / f);
  ct = Math.cos(pitch); st = Math.sin(pitch);
  UM = 0.8 * (W / 2) / f;                      // flock stays inside these view tangents
  VT = (cy - 0.13 * H) / f;
  VB = (cy - 0.62 * H) / f;
  sizeK = LIFE ? 1 : clamp(1150 / f, 1, 1.7);
  if (FOLLOW) fitSky(SKY_PX[0], SKY_PX[1]);   // the pan limit from the photograph's size, before it has loaded
  paintSky();
  fresh = true;
}

let _x = 0, _y = 0, _z = 0;
function P(x, y, z) {                          // world -> screen, result in _x _y (px) and _z (depth)
  if (yawS !== 0) { const xr = x * yawC - z * yawS; z = x * yawS + z * yawC; x = xr; }   // ?follow: the view's pan
  const yr = y - CAM_H;
  _z = yr * st + z * ct;
  const k = f / _z;
  _x = cx + x * k;
  _y = cy - (yr * ct - z * st) * k;
}
function screenToWorld(sx, sy, depth, out) {
  const dx = (sx - cx) / f, dy = (cy - sy) / f;
  out.x = dx * depth;
  out.y = CAM_H + (dy * ct + st) * depth;
  out.z = (ct - dy * st) * depth;
}

// ---------------------------------------------------------------- scenery
function fitSky(iw, ih) {                      // ?follow: spare photograph each side of the window, and the pan it allows
  const k = Math.max(f / ((ih / 2) / Math.tan(23 * Math.PI / 180)), W / iw, H / ih);
  skySpare = Math.max(0, Math.floor((iw * k - W) / 2));
  yawMax = Math.atan(skySpare / f);
}
function paintSky() {
  const g = sctx, r = rng(7);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const hz = HORIZON;

  if (skyReady) {                              // same focal length and horizon as the camera, scaled up only to cover
    const iw = skyImg.naturalWidth, ih = skyImg.naturalHeight, fi = (ih / 2) / Math.tan(23 * Math.PI / 180);
    const k = Math.max(f / fi, W / iw, H / ih);
    let vgx = g;
    if (FOLLOW) {                              // the whole width of the photograph, slid under a fixed vignette
      fitSky(iw, ih);
      sky.width = Math.round((W + 2 * skySpare) * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.drawImage(skyImg, skySpare + cx - iw * k / 2, hz - .8 * ih * k, iw * k, ih * k);
      if (!vig) vig = document.createElement('canvas');
      vig.width = canvas.width; vig.height = canvas.height;
      vgx = vig.getContext('2d'); vgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    } else g.drawImage(skyImg, cx - iw * k / 2, hz - .8 * ih * k, iw * k, ih * k);
    const vg = vgx.createRadialGradient(cx, cy * .95, Math.min(W, H) * .35, cx, cy, Math.hypot(W, H) * .62);
    vg.addColorStop(0, 'rgba(6,3,14,0)'); vg.addColorStop(1, 'rgba(6,3,14,.35)');
    vgx.fillStyle = vg; vgx.fillRect(0, 0, W, H);
    return;
  }

  const grad = g.createLinearGradient(0, 0, 0, hz);
  [[0, '#080a22'], [.26, '#1b1a4c'], [.52, '#573a7c'], [.74, '#bf5a62'], [.9, '#f0955b'], [1, '#ffc87c']]
    .forEach(([o, c]) => grad.addColorStop(o, c));
  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  for (let i = 0; i < 150; i++) {              // first stars
    const y = Math.pow(r(), 1.9) * hz * .6, x = r() * W;
    g.fillStyle = `rgba(255,240,228,${(.1 + r() * .5) * (1 - y / (hz * .6))})`;
    g.fillRect(x, y, r() < .12 ? 1.4 : .8, r() < .12 ? 1.4 : .8);
  }

  const sx = W * .7, sy = hz - H * .012;       // sun sinking behind the ridge
  let rg = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * .6);
  rg.addColorStop(0, 'rgba(255,214,150,.8)'); rg.addColorStop(.28, 'rgba(255,150,100,.3)'); rg.addColorStop(1, 'rgba(255,120,110,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  rg = g.createRadialGradient(sx, sy, 0, sx, sy, H * .06);
  rg.addColorStop(0, 'rgba(255,250,232,1)'); rg.addColorStop(.6, 'rgba(255,228,176,.95)'); rg.addColorStop(1, 'rgba(255,196,128,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(sx, sy, H * .06, 0, TAU); g.fill();

  const blob = (x, y, w, h, c, a) => {         // soft streak of cloud
    g.save(); g.translate(x, y); g.scale(w, h);
    const q = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    q.addColorStop(0, `rgba(${c},${a})`); q.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = q; g.beginPath(); g.arc(0, 0, 1, 0, TAU); g.fill(); g.restore();
  };
  for (let i = 0; i < 26; i++) {
    const t = .3 + .64 * Math.pow(r(), .85), y = hz * t, w = W * (.08 + r() * .24);
    const c = [Math.round(120 + 135 * t), Math.round(80 + 70 * t), Math.round(150 - 40 * t)].join(',');
    const a = .1 + r() * .16;
    for (let k = 0; k < 4; k++) blob(r() * W + (r() - .5) * w, y + (r() - .5) * H * .02, w * (.4 + r() * .6), w * (.02 + r() * .03), c, a);
  }

  const wob = (u, p) => .5 + .5 * (.5 * Math.sin(u * 5.1 + p[0]) + .32 * Math.sin(u * 11.7 + p[1]) + .18 * Math.sin(u * 27 + p[2]));
  const ridge = (base, amp, jag, fill, p) => {
    g.fillStyle = fill; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 3; x += 3) g.lineTo(x, base - wob(x / W, p) * amp - r() * jag);
    g.lineTo(W + 3, H); g.closePath(); g.fill();
  };
  const far = g.createLinearGradient(0, hz - H * .07, 0, hz + H * .03);
  far.addColorStop(0, '#7a4262'); far.addColorStop(1, '#3a2148');
  ridge(hz + H * .004, H * .05, 0, far, [1, 2, 3]);
  ridge(hz + H * .02, H * .045, 1, '#26173a', [4, 5, 6]);
  ridge(hz + H * .04, H * .035, 5, '#130c22', [7, 8, 9]);
  const mead = g.createLinearGradient(0, hz + H * .06, 0, H);
  mead.addColorStop(0, '#1a1030'); mead.addColorStop(.35, '#0d0919'); mead.addColorStop(1, '#06040b');
  g.fillStyle = mead; g.fillRect(0, hz + H * .06, W, H);

  for (let i = 0; i < 8; i++) {                // poplars
    const x = r() * W, th = H * (.1 + r() * .08), tw = th * (.06 + r() * .03), by = hz + H * .08;
    g.fillStyle = '#0a0711'; g.beginPath(); g.moveTo(x, by - th);
    g.quadraticCurveTo(x + tw * 1.5, by - th * .5, x + tw * .4, by); g.lineTo(x - tw * .4, by);
    g.quadraticCurveTo(x - tw * 1.5, by - th * .5, x, by - th); g.fill();
  }
  g.strokeStyle = '#050309'; g.lineCap = 'round';
  for (let i = 0; i < W / 3; i++) {            // reeds
    const x = r() * W, h = H * (.03 + .13 * r() * r() * r()), lean = (r() - .5) * h * .5;
    g.lineWidth = .8 + r() * 1.3;
    g.beginPath(); g.moveTo(x, H + 2); g.quadraticCurveTo(x + lean * .2, H - h * .6, x + lean, H - h); g.stroke();
  }

  const vg = g.createRadialGradient(cx, cy * .95, Math.min(W, H) * .35, cx, cy, Math.hypot(W, H) * .62);
  vg.addColorStop(0, 'rgba(6,3,14,0)'); vg.addColorStop(1, 'rgba(6,3,14,.5)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  const nc = document.createElement('canvas'); nc.width = nc.height = 96;   // grain to dither the gradients
  const nx = nc.getContext('2d'), id = nx.createImageData(96, 96);
  for (let i = 0; i < id.data.length; i += 4) { id.data[i] = id.data[i + 1] = id.data[i + 2] = r() * 255; id.data[i + 3] = 10; }
  nx.putImageData(id, 0, 0);
  g.fillStyle = g.createPattern(nc, 'repeat'); g.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------- flock
const M = 0.5;                                 // metres per world unit (used for the readout only)
const CRUISE = 23, VMIN = 12, VMAX = 30, MAX_ACC = 16;
const RS = params.has('rs') ? +params.get('rs') : 5, RN = 38;   // separation radius (?rs: experimental) / sanity cutoff on the topological neighbours
const W_SEP = 20, W_ALI = 18, W_COH = params.has('coh') ? +params.get('coh') : 6, W_TGT = 8, W_GLOBAL = .12, W_SPD = 1.5, W_SPD4 = .002, W_LEVEL = .9, W_FLEE = 70;
const R_FLEE = 65;
const R_FLOCK = 20 * Math.cbrt(N / 400), W_REJOIN = 2;   // beyond R_FLOCK (∝ N^⅓ at fixed density) birds head back, 1/s
// ?geom (experimental, off by default): flock geometry to match wild flocks (Ballerini 2008: a 1 : 2.8 : 5.6 slab at
// every size, uniform inside with a denser edge, density independent of N). The pull toward the flock's centre stands
// in for StarDisplay's roost attraction and preferred height (Hemelrijk & Hildenbrandt 2011), both global too.
//   1: its strength falls as (400/N)^(2/3), so the pressure it puts on the core (∝ k R²) no longer grows with N;
//   2: and it is GV times stiffer vertically, GH times horizontally: a trap whose equipotentials are ellipsoids of
//      aspect √(GV/GH) at every N, if the flock fills it at even density;
//   3: and cohesion is (1 + EDGE_G·c) times stronger for a bird whose neighbours lie to one side (c, 0 inside to 1 at
//      an edge; Hemelrijk & Hildenbrandt 2011), for a denser edge.
// Detached birds rejoin beyond RJ·R_FLOCK, a fixed radius.
const GEOM = +params.get('geom') || 0, G_SCALE = GEOM ? Math.pow(400 / N, +(params.get('gx') ?? 2 / 3)) : 1;
const GV = GEOM >= 2 ? +(params.get('gv') ?? 4) : 1, GH = GEOM >= 2 ? +(params.get('gh') ?? .5) : 1;
const EDGE_G = GEOM === 3 ? +(params.get('edge') ?? 1.5) : 0, RJ = GEOM ? +(params.get('rj') ?? (GEOM >= 2 ? 2 : 1)) : 1;
// 4: no spring. Only birds on the flock's edge (peripherality c above C0, full strength by C1) are pulled toward its
//    centre, with a fixed strength GF (GV times that vertically): a surface pressure that does not grow with N, no
//    force inside, and a flatness set by GV/GH alone.
// ge: the spring (levels 1-2) is (1 + GE·ramp(c)) times stronger for edge birds: edge weighting toward the flock's
// centre, not toward the local centroid (which clumps). kappa: vertical gain on local cohesion.
const GE = GEOM ? +(params.get('ge') ?? 0) : 0, KAPPA = GEOM ? +(params.get('kappa') ?? 1) : 1;
const GF = +(params.get('gf') ?? 3), C0 = +(params.get('c0') ?? .35), C1 = +(params.get('c1') ?? .7), PERI = EDGE_G || GEOM >= 4 || GE > 0;
const T_LAG = params.has('tlag') ? +params.get('tlag') : 1;   // experiment: scale the delay of the turn from front to back
// ?pturn=1 (experimental): equal-impulse turns. The flock-level push toward the waypoint is computed once per step and
// replayed to each bird after its delay, so every bird receives the same push and turns through the same angle on a
// parallel path (Attanasi et al. 2014). Otherwise birds share one stopping time, so the front turns up to ~2.4 s x
// 0.35 rad/s further than the back, and the flock is sheared on every turn by a velocity gradient alignment cannot undo.
const PTURN = params.get('pturn') === '1';
const drvX = new Float64Array(256), drvY = new Float64Array(256), drvZ = new Float64Array(256);   // pushes in 1/60 s bins
let drvFirst = -1, drvLast = -1;
const FRAME_CAP = 20;                          // largest framing acceleration, u/s²
// Birds and the falcon are drawn at life size, with no extra enlargement in small windows (sizeK 1). At the
// flock's 37-100 m a starling is then about 4-8 px across, as in real footage. ?life=0 (or ?classic) draws them
// twice life size, larger still in small windows (10-17 px), as the page used to. Drawing only.
const LIFE = opt('life');
const SPAN = LIFE ? .764 : 1.63;               // u, full-spread span: life size (0.382 m); about twice that under ?life=0
// Wingbeat and intermittent flight (starling/refs/pose_spec.md): 10–14 Hz (BG13, RA01). At 10–12 m/s a
// starling flaps in bursts of about 12–15 beats, then pauses 0.6–1 s (RA01 Table 1); most pauses are
// glides, and bounds with the wings folded get commoner with speed (TO95). P_BOUND is an estimate
// fitted to that trend. A frightened bird flaps without pausing. This is drawing only: it uses its own
// random stream, so a seeded run moves exactly as before.
const BEAT_HZ = [10, 14], BURST = [10, 16], PAUSE = [.5, 1], ALARM_PAUSE = .2;
const P_BOUND = v => clamp(.25 + (v * M - 10) / 16, .1, .6);   // v in u/s
const wrand = rng((params.has('seed') ? +params.get('seed') ^ 0x9E3779B9 : Math.random() * 4294967296) >>> 0);
// Behavioural noise: an Ornstein–Uhlenbeck acceleration per bird, stationary std NOISE (u/s²),
// correlation time NOISE_TAU. The paper argues the noise level, not the rule, sets the order and
// the correlation range, so ?noise=<factor> scales it. Measured on undisturbed flight (?calm, 400 birds):
//   0.5 → Φ ≈ 1.000, |u| ≈ 0.4 m/s, ξ/L ≈ 0.41 (rigid);  1 → Φ ≈ 0.99–1.00, |u| ≈ 1.0–1.5 m/s, ξ/L ≈ 0.35;
//   1.5 → Φ ≈ 0.99, |u| ≈ 1.9 m/s, the flock stretches to L ≈ 31 m and the far-side anticorrelation fades.
// A falcon strike dips Φ to 0.7–0.95 for a few seconds and can split the flock briefly.
// NOISE_TAU must be long against 1/(D k²) for the modes that matter (D ≈ W_ALI · 3.5 u², k ≈ π/L):
// with τ = 0.5 s and W_ALI = 4.5 the same noise gave C(r) ≈ 0 beyond 0.15 L.
const NOISE_K = params.has('noise') ? Math.max(0, +params.get('noise')) : 1;
const NOISE = 9 * NOISE_K, NOISE_TAU = params.has('tau') ? +params.get('tau') : 4;   // ?tau: experimental noise memory, s

const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N), vz = new Float32Array(N);
const ax = new Float32Array(N), ay = new Float32Array(N), az = new Float32Array(N);
const nzx = new Float32Array(N), nzy = new Float32Array(N), nzz = new Float32Array(N);   // OU noise state
const bank = new Float32Array(N), alarm = new Float32Array(N);
// Roll scatter. Banking from lateral acceleration alone leaves birds in level flight wings-level and drawn alike. Each
// bird's roll also wanders, with SD ATT_SD: an Ornstein-Uhlenbeck process passed through a lag of the same ATT_TAU, so
// the roll changes smoothly, with a correlation time of about 2 ATT_TAU (estimated). The SD is set by the waves rather
// than by still photographs. In the Rome hunting video of Storms et al. 2019 (ESM 1) the same patches of flock darken
// and lighten at wave pulses by a stripe signal of 0.17-0.20 (SD of the log optical depth against the same birds 0.5 s
// earlier and later, noise removed). Measured the same way, the page gives 0.17-0.19 with 15 deg here and WAVE_ROLL 1.1
// (0.22 before, with no scatter and WAVE_ROLL 0.8), but only 0.08-0.11 with 30 deg at any wave roll up to 90 deg: seen
// from below, extra roll adds less and less wing area. 15 deg adds about 3 deg to the within-frame spread of wing
// angles (sky/measure_attitude.py, the same frames with and without it); single frames already range 29-48 deg in the
// page, 27-47 in sharp photographs and 30-54 in video, where much of the variety is likely wingbeat pose rather than
// roll. Drawing only, from its own random stream: the flight is unchanged. ?roll=DEG sets it; ?roll=0 removes it.
let ATT_SD = (params.has('roll') ? +params.get('roll') : 15) * Math.PI / 180;
const ATT_TAU = 1;
const att = new Float32Array(N), attV = new Float32Array(N);   // att: unit-SD roll offset, drawn as ATT_SD * att; attV drives it
const arand = rng((params.has('seed') ? +params.get('seed') ^ 0xA77A : Math.random() * 4294967296) >>> 0);
const agauss = () => Math.sqrt(-2 * Math.log(1 - arand())) * Math.cos(TAU * arand());
for (let i = 0; i < N; i++) { attV[i] = agauss(); att[i] = Math.SQRT1_2 * (attV[i] + agauss()); }   // start in the steady state
const dodge = new Uint8Array(N);               // 1 while the bird is dodging the falcon (for the inset and the checks)
const phase = new Float32Array(N), freq = new Float32Array(N), size = new Float32Array(N);
const paused = new Uint8Array(N), pkind = new Uint8Array(N), ptime = new Float32Array(N), pw = new Float32Array(N);   // pkind 1 glide, 2 bound; pw 0 flapping .. 1 in the pause pose
const nbD = new Float32Array(K), nbI = new Int32Array(K);
const tgt = { x: 0, y: 0, z: 0 }, tmp = { x: 0, y: 0, z: 0 };
let gcx = 0, gcy = 0, gcz = 0, gvx = 0, gvy = 0, gvz = 0, lure = 0, lastMove = -1e9;
const ptr = { x: 0, y: 0 };
let stats = { pol: 0, nn: 0, out: 0 };

// Above the old cap of 3,000 birds the flock spans half the frame or more, and waypoints up to 30 % of the width off
// centre carried it out of the picture (10-36 % of 5,000 birds out at once, seeds 1-12); looping toward the camera, it
// also came in to the near limit, where its birds drew 1.4x too large. Big flocks aim nearer the middle and farther
// off (ZNEAR, WAY_Z); every flock size possible before flies exactly as it did.
const BIG = N > 3000, WAY_X = BIG && !FOLLOW ? .35 : 1, WAY_Z = BIG ? [160, 35] : [125, 70], ZNEAR = BIG ? 130 : ZMIN;
const way = { x: 0, y: 0, z: 0, ox: 0, oy: 0, oz: 0, hx: 1, hy: 0, hz: 0, t: -1e9 };
function nextWaypoint(t) {                     // usually the far side of the sky, sometimes a loop back
  const hl = Math.hypot(gvx, gvy, gvz) + 1e-6; // heading at the moment of the switch (drives the ripple lag)
  way.hx = gvx / hl; way.hy = gvy / hl; way.hz = gvz / hl;
  way.ox = way.x; way.oy = way.y; way.oz = way.z;
  P(gcx, gcy, gcz);
  const side = (_x > cx) === (rand() < .75) ? -1 : 1;
  screenToWorld(cx + side * W * (.1 + .2 * rand()) * WAY_X, H * (.27 + .2 * rand()), WAY_Z[0] + WAY_Z[1] * rand(), way);
  if (way.t < -1e8) { way.ox = way.x; way.oy = way.y; way.oz = way.z; }
  way.t = t;
}

function initFlock() {
  screenToWorld(cx + W * .05, H * .4, 140, tmp);
  for (let i = 0; i < N; i++) {
    const a = (rand() - .5) * .6, s = CRUISE * (.9 + .2 * rand());
    px[i] = tmp.x + (rand() - .5) * 46; py[i] = tmp.y + (rand() - .5) * 24; pz[i] = tmp.z + (rand() - .5) * 46;
    vx[i] = s * Math.cos(a); vy[i] = (rand() - .5) * 2; vz[i] = s * Math.sin(a);
    phase[i] = rand() * TAU; freq[i] = BEAT_HZ[0] + rand() * (BEAT_HZ[1] - BEAT_HZ[0]); size[i] = .85 + .3 * rand();
    paused[i] = 0; pkind[i] = 1; pw[i] = 0; ptime[i] = wrand() * BURST[1] / freq[i];   // birds start at random points in a burst
    nzx[i] = NOISE * gauss(); nzy[i] = NOISE * gauss(); nzz[i] = NOISE * gauss();
  }
}

// ---------------------------------------------------------------- falcon
// The hunt follows falcon/refs/hunting_notes.md (§6 maps each finding onto this code). A hunt is 1–4
// strikes, about 3 on average (Rome roost; Procaccini 2011, Zoratto 2010). Each strike: take up a
// position above, beside or below the flock (50/39/11 %, between the Storms 2019 and Procaccini 2011
// tallies), stoop on the nearest bird steered by proportional navigation, a = N λ̇ × v (Brighton 2017:
// no lead and no range needed), then zoom-climb, trading the speed back for height (Dekker 2009).
// About 30 % of strikes follow the last within 5 s. A strike is logged but never takes a bird.
const fal = {
  on: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, age: 0, prey: 0, side: 1, phase: 0, fan: 0, flap: 1,
  mode: 'leave', mt: 0, kind: 0, strikes: 0, quota: 0, chain: false, lastPass: -1e9, clickPrey: -1,
  range: 1e9, pn: false, pnT: 0, pnPath: 0, peak: 0, nSum: 0, nCnt: 0, flash: false, fleeK: 0, waves: false, pulses: 0, pulseN: 0, pulseT: -1e9,
  minMiss: 1e9, spd: 1, nearAny: 1e9, caAlong: 0, caLat: 0, caUp: 0,
};
let flockRg = 1;                               // radius of gyration, from the last step
const CALM = params.has('calm');               // ?calm: no spontaneous attacks (clicks still work)
let nextFalcon = CALM ? Infinity : 14 + rand() * 6;
const FAL_CRUISE = 30;                         // u/s, 15 m/s: shadowing flight, 1.3× the flock as in StarEscape and Mills 2018
const FAL_STOOP = [72, 52, 40];                // u/s, target speed from above (36 m/s, inside Alerstam's 31–39 m/s radar stoops), beside, below
const FAL_G = 19.6, FAL_THRUST = 6, FAL_DRAG = 15;   // u/s²: gravity at 0.5 m/u; flapping gain and braking along the path (estimates)
const PN_N = 2.6, PN_DELAY = .05, LOS_ERR = .007;   // median gain of wild peregrines (Brighton 2017). As in Mills 2018: the line of sight is seen
                                               // with an error of up to 0.007 rad and its rate is the difference of two sightings PN_DELAY apart, used PN_DELAY late
const TURN_IN = .8;                            // cos of the angle off the line of sight below which the falcon first turns in by pure pursuit
const PN_ACC = 49;                             // u/s²: turns of at most about 2.5 g, as measured in stoops (Brighton 2017)
const STAGE_OFF = 110, STAGE_UP = [90, 0, -50];   // u: where the falcon waits, 55 m beside the flock on its own side and 45 m above, level, or 25 m below;
                                               // it gives a guided final approach of about 75 m (47–114 m measured, Brighton 2017)
const STAGE_ZMIN = ZMIN;                       // u: the waiting spot stays at least this far in front of the camera (as near as the flock may come)
const CONTACT = .4;                            // u: a pass within 0.2 m counts as a catch, as in Mills 2018
// Each stoop is slow, medium or fast as often as in Storms 2019 (16/144/15 of 175 attacks). The paper gives no
// speeds for its classes, so STOOP_K, the factor on the stoop's target speed, is an estimate; 78 u/s (39 m/s) is
// the fastest wild stoop measured (Alerstam 1987).
const SPD_MIX = [.09, .82, .09], STOOP_K = [.8, 1, 1.12], STOOP_MAX = 78;
// Chance of a flash expansion, by [above, side, below][slow, medium, fast]. Storms 2019 Fig. 6 gives the share of
// attacks followed by one within 5 s for each direction (42/11/22 %) and each speed (0/36/47 %), and Table S2 finds
// the two effects additive (no interaction). These are the cells of an additive logistic model that reproduces all
// six shares exactly, assuming direction and speed independent (the joint table is not published). Slow attacks
// were never followed by one.
const P_FLASH = [[0, .453, .572], [0, .117, .177], [0, .235, .332]];
const srand = rng((params.has('seed') ? +params.get('seed') ^ 0x51ED : Math.random() * 4294967296) >>> 0);   // stoop speed and flash only, so ?calm runs are unchanged
const FLEE_QUIET = 0;                          // no general flight from the falcon without a flash expansion: only birds in its path dodge
// Blackening (Storms 2019: the flock darkens, often 5–15 s before an attack) is not modelled. A mild alarm in
// birds within 70 m of a falcon that was not stooping tightened the flock, but the optical density measured by
// murmuration-falcon.js did not rise before attacks any more than without it, so it was left out.
// Last-moment dodge: a bird in the falcon's path (within DODGE_W of its line of flight) that it would reach
// within DODGE_T turns off that line at 3.4 g, the load factor of Mills 2018's model starling. It applies in
// every mode, not only the stoop: the falcon carries its speed on through the flock after the pass.
// DODGE_T and DODGE_W are not measured. With them about 20 % of strikes and 45–50 % of hunts would end in a
// catch: above the 23 % of hunts seen in Rome, close to the 26–31 % per attack of Mills 2018's simulations.
// No catch is drawn; murmuration-falcon.js reports the rate.
const DODGE_T = .5, DODGE_ACC = 67, DODGE_W = 4;
const P_CHAIN = .3;                            // chance the next strike follows straight after the climb
const P_WAVES = .4, PULSE_GAP = .86;           // orientation waves in 36–42 % of hunts (Procaccini 2011), pulses 0.86 s apart at one spot (Storms 2019)
// Waves come before attacks as well as after them: 28 % of attacks are preceded by one (Storms 2019 Fig. 3), on
// average 13.9 s before (Table S1). In a wave hunt the flock starts 2–3 pulses while the falcon takes up its
// position (from PRE_WAVE_T s in), in P_PRE_WAVE of those waits (fitted to the 28 %). Waves were likeliest around medium-speed attacks (Table S3, no rates given), so
// slow and fast stoops carry them half as often. Both are estimates.
const PRE_WAVE_T = 1, P_PRE_WAVE = .7;
const huntLog = [];                            // strikes, pulses and hunts, for murmuration-falcon.js
const logEvent = e => { huntLog.push(e); if (huntLog.length > 400) huntLog.shift(); };
const losQ = Array.from({ length: 32 }, () => ({ t: -1e9, x: 0, y: 0, z: 0 }));
let losHead = 0, pulseId = 0;
const stage = { x: 0, y: 0, z: 0 };

function launchFalcon(clickX, clickY) {
  if (fal.on) return;
  fal.on = true; fal.age = 0; fal.phase = 0; fal.strikes = 0; fal.fan = 0; fal.flap = 1; fal.minMiss = 1e9;
  const q = rand(); fal.quota = q < .1 ? 1 : q < .35 ? 2 : q < .7 ? 3 : 4;   // 1–4 strikes, mean 2.85
  fal.waves = rand() < P_WAVES;
  fal.side = clickX == null ? (rand() < .5 ? -1 : 1) : (clickX < cx ? 1 : -1);
  screenToWorld(fal.side > 0 ? W * 1.12 : -W * .12, H * (.18 + .12 * rand()), 190 + 30 * rand(), tmp);
  fal.x = tmp.x; fal.y = tmp.y; fal.z = tmp.z;
  const dx = gcx - fal.x, dy = gcy - fal.y, dz = gcz - fal.z, d = Math.hypot(dx, dy, dz);
  fal.vx = dx / d * FAL_CRUISE; fal.vy = dy / d * FAL_CRUISE; fal.vz = dz / d * FAL_CRUISE;
  fal.clickPrey = -1;
  if (clickX != null) {                        // a click sends the falcon straight at the bird nearest the click
    let best = 1e9;
    if (FOLLOW && skyReady) { yawC = Math.cos(yaw); yawS = Math.sin(yaw); }   // the bird under the pointer in the panned view
    for (let i = 0; i < N; i++) {
      P(px[i], py[i], pz[i]);
      const d2 = (_x - clickX) ** 2 + (_y - clickY) ** 2;
      if (d2 < best) { best = d2; fal.clickPrey = i; }
    }
    yawC = 1; yawS = 0;
    fal.kind = fal.y > gcy + 15 ? 0 : fal.y < gcy - 15 ? 2 : 1;
    startStoop(0);
  } else startPosition();
}

function startPosition() {
  const r = rand();
  fal.kind = r < .5 ? 0 : r < .89 ? 1 : 2;
  fal.mode = 'position'; fal.mt = 0;
  fal.pulses = 0; fal.pulseN = fal.waves && srand() < P_PRE_WAVE ? 2 + (srand() < .5 ? 1 : 0) : 0;
}

function startStoop(t) {
  let best = 1e9;
  if (fal.clickPrey >= 0) { fal.prey = fal.clickPrey; fal.clickPrey = -1; }
  else for (let i = 0; i < N; i++) {           // lock on to the nearest bird and keep it for the whole pass
    const dd = (px[i] - fal.x) ** 2 + (py[i] - fal.y) ** 2 + (pz[i] - fal.z) ** 2;
    if (dd < best) { best = dd; fal.prey = i; }
  }
  fal.mode = 'stoop'; fal.mt = 0; fal.pn = false; fal.pnT = 0; fal.pnPath = 0; fal.range = 1e9; fal.peak = 0; fal.nSum = 0; fal.nCnt = 0; fal.nearAny = 1e9;
  const q = srand(); fal.spd = q < SPD_MIX[0] ? 0 : q < SPD_MIX[0] + SPD_MIX[1] ? 1 : 2;
  fal.flash = srand() < P_FLASH[fal.kind][fal.spd];
  fal.pulses = 0; fal.pulseN = fal.waves && (fal.spd === 1 || srand() < .5) ? 2 + (rand() < .5 ? 1 : 0) : 0;
  for (const q of losQ) q.t = -1e9;
  logEvent({ type: 'stoop', t, kind: fal.kind, spd: fal.spd, prey: fal.prey, flash: fal.flash });
}

function endStoop(t) {
  const sp = Math.hypot(fal.vx, fal.vy, fal.vz);
  logEvent({ type: 'strike', t, kind: fal.kind, spd: fal.spd, miss: fal.range, peak: fal.peak, n: fal.nCnt ? fal.nSum / fal.nCnt : NaN,
    contact: fal.range < CONTACT, dur: fal.mt, pnDur: fal.pnT, pnPath: fal.pnPath, flash: fal.flash, speedAtPass: sp,
    nearAny: fal.nearAny, caAlong: fal.caAlong, caLat: fal.caLat, caUp: fal.caUp });
  fal.minMiss = Math.min(fal.minMiss, fal.range);
  fal.strikes++; fal.lastPass = t;
  fal.mode = 'climb'; fal.mt = 0; fal.chain = rand() < P_CHAIN;
}

function seedPulse(t) {                        // the wave starts at the bird nearest the falcon
  let best = 1e9, k = 0;
  for (let i = 0; i < N; i++) {
    const dd = (px[i] - fal.x) ** 2 + (py[i] - fal.y) ** 2 + (pz[i] - fal.z) ** 2;
    if (dd < best) { best = dd; k = i; }
  }
  triggerWave(k, 1, ++pulseId);
  fal.pulses++; fal.pulseT = t;
  logEvent({ type: 'pulse', t, id: pulseId, bird: k, x: px[k], y: py[k], z: pz[k] });
}

const falDepth = () => (fal.y - CAM_H) * st + fal.z * ct;   // the falcon's distance in front of the camera, u

// Steering toward a velocity: the falcon's own flight between stoops (not PN).
function seek(vxT, vyT, vzT, rate, cap) {
  let aX = (vxT - fal.vx) * rate, aY = (vyT - fal.vy) * rate, aZ = (vzT - fal.vz) * rate;
  const am = Math.hypot(aX, aY, aZ);
  if (am > cap) { aX *= cap / am; aY *= cap / am; aZ *= cap / am; }
  return [aX, aY, aZ, am];
}

function updateFalcon(dt, t) {
  if (!fal.on) { if (t > nextFalcon) launchFalcon(null); return; }
  fal.age += dt; fal.mt += dt;
  const sp = Math.hypot(fal.vx, fal.vy, fal.vz) + 1e-6;
  let aX = 0, aY = 0, aZ = 0, turn = 0;

  if (fal.mode === 'stoop') {
    const i = fal.prey;
    const rx = px[i] - fal.x, ry = py[i] - fal.y, rz = pz[i] - fal.z, r2 = rx * rx + ry * ry + rz * rz + 1e-6, r = Math.sqrt(r2);
    const wx = vx[i] - fal.vx, wy = vy[i] - fal.vy, wz = vz[i] - fal.vz;
    {                                          // a noisy sighting of the line of sight
      let ex = rand() - .5, ey = rand() - .5, ez = rand() - .5;
      const ux = rx / r, uy = ry / r, uz = rz / r, ed = ex * ux + ey * uy + ez * uz;
      ex -= ed * ux; ey -= ed * uy; ez -= ed * uz;
      const e = LOS_ERR * rand() / (Math.hypot(ex, ey, ez) + 1e-9);
      const q = losQ[losHead = (losHead + 1) % losQ.length], qx = ux + ex * e, qy = uy + ey * e, qz = uz + ez * e, ql = Math.hypot(qx, qy, qz);
      q.t = t; q.x = qx / ql; q.y = qy / ql; q.z = qz / ql;
    }
    const sighting = age => {                  // the latest sighting at least `age` seconds old
      for (let k = 0; k < losQ.length; k++) { const q = losQ[(losHead - k + losQ.length) % losQ.length]; if (q.t <= t - age) return q; }
      return null;
    };
    const A = sighting(2 * PN_DELAY), B = sighting(PN_DELAY);   // λ̇ ≈ û₁ × û₂ / Δt
    const L = A && B ? { x: (A.y * B.z - A.z * B.y) / PN_DELAY, y: (A.z * B.x - A.x * B.z) / PN_DELAY, z: (A.x * B.y - A.y * B.x) / PN_DELAY } : null;
    // The stoop opens by tipping over toward the prey (pure pursuit) until the falcon heads within
    // ~37° of the line of sight; from then on it holds proportional navigation to the end.
    const cosd = (rx * fal.vx + ry * fal.vy + rz * fal.vz) / (r * sp);
    if (!fal.pn && cosd > TURN_IN) fal.pn = true;
    if (!fal.pn) {
      aX = (rx / r * sp - fal.vx) * 3; aY = (ry / r * sp - fal.vy) * 3; aZ = (rz / r * sp - fal.vz) * 3;
    } else if (L) {
      aX = PN_N * (L.y * fal.vz - L.z * fal.vy); aY = PN_N * (L.z * fal.vx - L.x * fal.vz); aZ = PN_N * (L.x * fal.vy - L.y * fal.vx);
      fal.nSum += PN_N; fal.nCnt++; fal.pnT += dt; fal.pnPath += sp * dt;
    }
    turn = Math.hypot(aX, aY, aZ);
    if (turn > PN_ACC) { aX *= PN_ACC / turn; aY *= PN_ACC / turn; aZ *= PN_ACC / turn; turn = PN_ACC; }
    // Speed along the path: gravity in the dive, a little flapping, braking above the target speed.
    const descent = -fal.vy / sp;
    const along = clamp((Math.min(FAL_STOOP[fal.kind] * STOOP_K[fal.spd], STOOP_MAX) - sp) * 1.5, -FAL_DRAG, FAL_THRUST + FAL_G * descent);
    aX += along * fal.vx / sp; aY += along * fal.vy / sp; aZ += along * fal.vz / sp;
    fal.peak = Math.max(fal.peak, sp);
    if (fal.pulses < fal.pulseN && r < R_FLEE && t - fal.pulseT > PULSE_GAP) seedPulse(t);
    if (r < fal.range) {
      fal.range = r;
      // Where the closest approach happens relative to the flock, in radii of gyration along the flock's
      // heading, across it and up: a large caAlong means the falcon passed ahead of the flock.
      const gl = Math.hypot(gvx, gvz) + 1e-6, hx = gvx / gl, hz = gvz / gl, ox = fal.x - gcx, oz = fal.z - gcz;
      fal.caAlong = (ox * hx + oz * hz) / flockRg; fal.caLat = (oz * hx - ox * hz) / flockRg; fal.caUp = (fal.y - gcy) / flockRg;
    } else if ((fal.range < 40 && r > fal.range + 3 && fal.mt > 1) || fal.mt > 8) endStoop(t);   // past the closest approach
  } else if (fal.mode === 'climb') {           // zoom climb: pitch up 40° along the current heading, shedding speed
    const hl = Math.hypot(fal.vx, fal.vz) + 1e-6, c = Math.cos(.7), s = Math.sin(.7);
    [aX, aY, aZ, turn] = seek(fal.vx / hl * c * FAL_CRUISE, s * FAL_CRUISE, fal.vz / hl * c * FAL_CRUISE, 1.5, 55);
    if (fal.mt > (fal.chain ? 1.2 : 2)) {        // a chained strike mounts briefly and swoops again
      if (fal.strikes >= fal.quota || fal.age > 60) { fal.mode = 'leave'; logEvent({ type: 'hunt', t, strikes: fal.strikes, waves: fal.waves, minMiss: fal.minMiss, contact: fal.minMiss < CONTACT }); }
      else if (fal.chain && falDepth() > STAGE_ZMIN / 2) startStoop(t);   // not from over the observer's head
      else startPosition();
    }
  } else if (fal.mode === 'position') {        // wait beside the flock on the falcon's side, a little ahead of it
    let hx = gvx, hz = gvz; const hl = Math.hypot(hx, hz) + 1e-6; hx /= hl; hz /= hl;
    let lx = -hz, lz = hx;
    if ((fal.x - gcx) * lx + (fal.z - gcz) * lz < 0) { lx = -lx; lz = -lz; }
    stage.x = gcx + lx * STAGE_OFF + hx * 30; stage.y = gcy + STAGE_UP[fal.kind]; stage.z = gcz + lz * STAGE_OFF + hz * 30;
    {                                          // never over the observer's head: push the spot out along the line of sight, by
      const zs = (stage.y - CAM_H) * st + stage.z * ct;   // just the shortfall, so it moves continuously and the turn stays smooth
      if (zs < STAGE_ZMIN) { stage.y += (STAGE_ZMIN - zs) * st; stage.z += (STAGE_ZMIN - zs) * ct; }
    }
    const dx = stage.x - fal.x, dy = stage.y - fal.y, dz = stage.z - fal.z, d = Math.hypot(dx, dy, dz) + 1e-6;
    const v = FAL_CRUISE * clamp(d / 40, .8, 1.4);
    [aX, aY, aZ, turn] = seek(gvx + dx / d * v, gvy + dy / d * v, gvz + dz / d * v, 2.4, 55);
    if (fal.mt > PRE_WAVE_T && fal.pulses < fal.pulseN && t - fal.pulseT > PULSE_GAP) seedPulse(t);
    if ((d < 20 || fal.mt > 6) && t - fal.lastPass > 5 && falDepth() > STAGE_ZMIN / 2) startStoop(t);
  } else {                                     // leave
    screenToWorld(fal.side > 0 ? -W * .35 : W * 1.35, H * .1, 200, tmp);
    const dx = tmp.x - fal.x, dy = tmp.y - fal.y, dz = tmp.z - fal.z, d = Math.hypot(dx, dy, dz) + 1e-6;
    [aX, aY, aZ, turn] = seek(dx / d * 32, dy / d * 32, dz / d * 32, 2.4, 55);
  }

  fal.fan += (Math.min(1, turn / 55) - fal.fan) * Math.min(1, dt * 4);   // tail spreads in hard turns
  fal.flap += ((fal.mode === 'position' || fal.mode === 'leave' ? 1 : 0) - fal.flap) * Math.min(1, dt * 3);   // flaps between stoops, glides and dives in them
  fal.phase += dt * TAU * 5.1;                 // 5.1 Hz wingbeat (falcon/refs/pose_spec.md)
  fal.fleeK += ((fal.mode === 'stoop' && fal.flash ? 1 : FLEE_QUIET) - fal.fleeK) * Math.min(1, dt * 6);
  fal.vx += aX * dt; fal.vy += aY * dt; fal.vz += aZ * dt;
  fal.x += fal.vx * dt; fal.y += fal.vy * dt; fal.z += fal.vz * dt;
  P(fal.x, fal.y, fal.z);
  if (fal.age > 75 || (fal.mode === 'leave' && (_x < -W * .1 || _x > W * 1.1))) {
    if (fal.mode !== 'leave') logEvent({ type: 'hunt', t, strikes: fal.strikes, waves: fal.waves, minMiss: fal.minMiss, contact: fal.minMiss < CONTACT, cut: true });
    fal.on = false; nextFalcon = CALM ? Infinity : t + 28 + rand() * 24;
  }
}

// velocity, wing phase at its current rate), each into a clear layer; the layers are averaged (additive at 1/SUBS),
// so a pixel covered for part of the exposure gets that fraction of a bird's opacity. Drawing only.
const SHUTTER = opt('shutter') ? Math.max(0, +params.get('shutter') || 1000 / 60) / 1000 : 0;   // s (?shutter=8: 8 ms)
const SUBS = SHUTTER > 0 ? clamp(Math.round(SHUTTER * 240) + 1, 2, 8) : 1;
let lay = null, acc = null;
function ensureLayers() {
  for (const k of ['lay', 'acc']) {
    let c = k === 'lay' ? lay : acc;
    if (!c) { c = document.createElement('canvas'); c.ctx = c.getContext('2d'); if (k === 'lay') lay = c; else acc = c; }
    if (c.width !== canvas.width || c.height !== canvas.height) { c.width = canvas.width; c.height = canvas.height; }
  }
}

// ?grain[=K]: camera noise. The photographed sky is otherwise the same in every frame, where filmed sky flickers by about
// a grey level from frame to frame (review/pixel_metrics.py: mean |change| 0.68 over clear sky in real_calm, with the
// camera's pan removed). A 128-centred noise tile is overlaid at a fresh offset each frame, from its own random stream
// (the flight is unchanged). GRAIN_SD is set so K = 1 gives that after the 1280x720 review encode (3.4 gave 0.74).
const GRAIN = opt('grain') ? Math.max(0, +params.get('grain') || 1) : 0, GRAIN_SD = 3.1, GRAIN_PX = 512;   // ?grain=2: twice
const grand = rng((params.has('seed') ? +params.get('seed') ^ 0x6A41 : Math.random() * 4294967296) >>> 0);
let grainPat = null;
function drawGrain() {
  if (!grainPat) {
    grainPat = [];
    for (let k = 0; k < 4; k++) {
      const c = document.createElement('canvas'); c.width = c.height = GRAIN_PX;
      const gx = c.getContext('2d'), id = gx.createImageData(GRAIN_PX, GRAIN_PX);
      for (let i = 0; i < id.data.length; i += 4) {
        const v = 128 + GRAIN * GRAIN_SD * Math.sqrt(-2 * Math.log(1 - grand())) * Math.cos(TAU * grand());
        id.data[i] = id.data[i + 1] = id.data[i + 2] = clamp(Math.round(v), 0, 255); id.data[i + 3] = 255;
      }
      gx.putImageData(id, 0, 0);
      grainPat.push(ctx.createPattern(c, 'repeat'));
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, -GRAIN_PX * grand(), -GRAIN_PX * grand());
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = grainPat[(grand() * 4) | 0];
  ctx.fillRect(0, 0, canvas.width + GRAIN_PX, canvas.height + GRAIN_PX);
  ctx.restore();
}

function drawBirds(g, back) {                  // birds and falcon as they were `back` seconds ago (0: now)
  if (FOLLOW && skyReady) { const a = yaw - yawV * back; yawC = Math.cos(a); yawS = Math.sin(a); }
  for (let b = 0; b < NB; b++) { fills[b].length = 0; bodies[b].length = 0; binN[b] = 0; }
  for (let i = 0; i < N; i++) {
    const x = px[i] - vx[i] * back, y = py[i] - vy[i] * back, z = pz[i] - vz[i] * back;
    P(x, y, z);
    if (_z < 10) continue;
    const b = clamp(((_z - ZMIN) / (ZMAX - ZMIN) * NB) | 0, 0, NB - 1);
    if (binN[b]++ % (BATCH || Infinity) === 0) { fills[b].push(new Path2D()); bodies[b].push(new Path2D()); }
    const s = 1 / Math.hypot(vx[i], vy[i], vz[i]);
    const p = pw[i], bound = pkind[i] === 2;
    const ph = phase[i] - (back && freq[i] * back * TAU * (1 + .25 * alarm[i]) * (1 - p));   // as step() advances it
    const th = (-.05 + .78 * Math.cos(ph)) * (1 - p) + (bound ? 0 : .1) * p;   // flapping: tip 42° above the shoulder at the top of the stroke, 48° below at the bottom; glide: 6° dihedral
    const flex = Math.max(0, -Math.sin(ph));                    // wings spread on the way down, flexed on the way up
    pushBird(fills[b][fills[b].length - 1], bodies[b][bodies[b].length - 1], x, y, z, vx[i] * s, vy[i] * s, vz[i] * s, bank[i] + ATT_SD * att[i] + waveRoll(i), th, flex, size[i] * sizeK, SPAN, p, bound ? STARLING.bound : STARLING.glide);
  }
  g.lineCap = 'round';
  for (let b = NB - 1; b >= 0; b--) {
    g.fillStyle = g.strokeStyle = (skyReady ? PHOTO_COL : fillCol)[b];
    g.lineWidth = lineW[b] * Math.max(.8, f / 1272) * STROKE_K;
    for (const q of fills[b]) g.fill(q);
    for (const q of bodies[b]) g.stroke(q);
  }

  const fx = fal.x - fal.vx * back, fy = fal.y - fal.vy * back, fzw = fal.z - fal.vz * back;
  P(fx, fy, fzw);
  const fz = _z;
  if (fal.on && fz > 10) {                     // as for the birds: a falcon beside or behind the camera is not drawn (it would project huge)
    const s = 1 / Math.hypot(fal.vx, fal.vy, fal.vz);
    const dive = clamp(-fal.vy * s * 2, 0, 1);
    const fp = [new Path2D(), new Path2D(), new Path2D()];           // right wing, left wing, body
    pushFalcon(fp, fx, fy, fzw, fal.vx * s, fal.vy * s, fal.vz * s, .2 + .5 * Math.sin(fal.phase - back * TAU * 5.1) * fal.flap * (1 - dive), FALCON_SPAN * sizeK, dive, fal.fan * (1 - dive));
    g.fillStyle = g.strokeStyle = '#170a10'; g.lineWidth = Math.max(.8, f / 1272) * STROKE_K; g.lineJoin = 'round';
    g.globalAlpha = clamp((fz - 10) / 20, 0, 1);   // fades out over its last 5 m toward the camera instead of popping
    for (const part of fp) { g.fill(part); g.stroke(part); }
    g.globalAlpha = 1;
  }
}

function draw(dt = 1 / 60) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // The sky is laid over the last frame at TRAIL opacity per 1/60 s. At the default 1 every frame starts clean; with
  // ?trail (.5) moving birds leave fading ghosts. Those were dropped as the default: they were 37-52 % of the bird ink
  // on screen and stepped copies were the commonest tell against real photographs, where a moving bird is one
  // continuous smear. Scaled by the frame's duration so ghosts last as long at any frame rate.
  ctx.globalAlpha = fresh ? 1 : 1 - (1 - TRAIL) ** (dt * 60); fresh = false;
  if (FOLLOW && skyReady) {
    ctx.drawImage(sky, -skySpare - f * Math.tan(yaw), 0, W + 2 * skySpare, H);
    ctx.drawImage(vig, 0, 0, W, H);
  } else ctx.drawImage(sky, 0, 0, W, H);
  ctx.globalAlpha = 1;
  if (FOLLOW && skyReady) { yawC = Math.cos(yaw); yawS = Math.sin(yaw); }   // the view's pan, for drawing only (reset below)

  if (SUBS === 1) drawBirds(ctx, 0);
  else {                                       // ?shutter: average SUBS instants over the exposure, ending now
    ensureLayers();
    acc.ctx.setTransform(1, 0, 0, 1, 0, 0); acc.ctx.clearRect(0, 0, acc.width, acc.height);
    acc.ctx.globalCompositeOperation = 'lighter'; acc.ctx.globalAlpha = 1 / SUBS;
    for (let j = 0; j < SUBS; j++) {
      lay.ctx.setTransform(1, 0, 0, 1, 0, 0); lay.ctx.clearRect(0, 0, lay.width, lay.height);
      lay.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawBirds(lay.ctx, SHUTTER * j / (SUBS - 1));
      acc.ctx.drawImage(lay, 0, 0);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(acc, 0, 0); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  if (GRAIN) drawGrain();
  if (showPanel) drawPanel();
  if (showInset) drawInset();
  yawC = 1; yawS = 0;
}

// Study inset (?inset; I toggles it, P pauses, . steps one frame). The picture is a single perspective view,
// so a falcon that overlaps the flock on screen may be far in front of or behind it. The inset shows the
// same moment from above (x across, depth up) and from the side (depth across, height up), with the line
// of sight through the falcon: birds on that line are the ones it covers on screen. Drawing only.
let showInset = params.has('inset');
const trail = [];                              // the falcon's last 3 s: [x, y, z, mode, t]
const MODE_COL = { stoop: '#ff5a4a', climb: '#ffa040', position: '#5ad2ff', leave: '#b8b8c8' };
function falconNearest() {
  let d = 1e9;
  for (let i = 0; i < N; i++) d = Math.min(d, Math.hypot(px[i] - fal.x, py[i] - fal.y, pz[i] - fal.z));
  return d;
}
function drawInset() {
  const sz = Math.round(clamp(Math.min(W, H) * .26, 130, 230)), pad = 14, x0 = pad;   // top left: the flock is framed toward the right
  if (fal.on) { trail.push([fal.x, fal.y, fal.z, fal.mode, simT]); while (trail.length && trail[0][4] < simT - 3) trail.shift(); }
  else trail.length = 0;
  const R = fal.on ? clamp(1.25 * Math.hypot(fal.x - gcx, fal.y - gcy, fal.z - gcz), 60, 260) : 60;
  const d3 = fal.on ? falconNearest() : NaN;
  const views = [   // [label, horizontal, vertical, line of sight from the camera in this plane]
    ['FROM ABOVE  x → · depth ↑', (x, y, z) => x - gcx, (x, y, z) => z - gcz, [fal.x, fal.z]],
    ['FROM THE SIDE  depth → · height ↑', (x, y, z) => z - gcz, (x, y, z) => y - gcy, [fal.z, fal.y - CAM_H]],
  ];
  ctx.save();
  ctx.font = FONT; ctx.textBaseline = 'middle';
  views.forEach(([label, U, V, los], k) => {
    const y0 = pad + k * (sz + pad), mx = x0 + sz / 2, my = y0 + sz / 2, s = sz / 2 / R;
    ctx.fillStyle = 'rgba(8,6,20,.72)'; ctx.beginPath(); ctx.roundRect(x0, y0, sz, sz, 6); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, sz, sz); ctx.clip();
    if (fal.on) {                              // line of sight through the falcon
      const l = Math.hypot(los[0], los[1]) + 1e-6, fx = mx + U(fal.x, fal.y, fal.z) * s, fy = my - V(fal.x, fal.y, fal.z) * s;
      ctx.strokeStyle = 'rgba(255,238,220,.25)'; ctx.setLineDash([4, 4]); ctx.beginPath();
      ctx.moveTo(fx - los[0] / l * 2 * sz, fy + los[1] / l * 2 * sz); ctx.lineTo(fx + los[0] / l * 2 * sz, fy - los[1] / l * 2 * sz); ctx.stroke(); ctx.setLineDash([]);
    }
    for (let i = 0; i < N; i++) {
      ctx.fillStyle = dodge[i] ? '#ff4040' : alarm[i] > .3 ? '#ffd24a' : wT[i] < .55 ? '#6aa8ff' : 'rgba(220,220,235,.6)';
      ctx.fillRect(mx + U(px[i], py[i], pz[i]) * s - .75, my - V(px[i], py[i], pz[i]) * s - .75, 1.5, 1.5);
    }
    for (let j = 1; j < trail.length; j++) {
      const a = trail[j - 1], b = trail[j];
      ctx.strokeStyle = MODE_COL[b[3]] || '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(mx + U(a[0], a[1], a[2]) * s, my - V(a[0], a[1], a[2]) * s); ctx.lineTo(mx + U(b[0], b[1], b[2]) * s, my - V(b[0], b[1], b[2]) * s); ctx.stroke();
    }
    if (fal.on) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mx + U(fal.x, fal.y, fal.z) * s, my - V(fal.x, fal.y, fal.z) * s, 3, 0, TAU); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,238,220,.6)'; ctx.textAlign = 'left'; ctx.fillText(label, x0 + 8, y0 + 10);
    ctx.textAlign = 'right'; ctx.fillText(`${fmt(2 * R * M, 0)} m`, x0 + sz - 8, y0 + sz - 10);
  });
  const ty = 2 * (sz + pad) + 8;
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,238,220,.85)';
  if (fal.on) {
    const zf = (fal.y - CAM_H) * st + fal.z * ct, zg = (gcy - CAM_H) * st + gcz * ct;
    ctx.fillText(`${fal.mode}  ·  nearest bird ${fmt(d3 * M, 1)} m  ·  ${fmt(Math.abs(zf - zg) * M, 0)} m ${zf < zg ? 'in front of' : 'behind'} the flock centre`, x0, ty);
    P(fal.x, fal.y, fal.z);                    // ring on the main view: red within 2 m of a bird, amber within 6 m
    if (_z > 10) {
      ctx.strokeStyle = d3 < 4 ? '#ff4040' : d3 < 12 ? '#ffb040' : 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(_x, _y, FALCON_SPAN * sizeK * f / _z * .6 + 6, 0, TAU); ctx.stroke();
    } else ctx.fillText('the falcon is beside or behind you', x0, ty + 32);
  } else ctx.fillText('no falcon  ·  red dodging · yellow alarmed · blue rolling', x0, ty);
  if (halted) { ctx.textAlign = 'left'; ctx.fillText(`PAUSED t ${fmt(simT, 2)} s  ·  P resume  ·  . step`, x0, ty + 16); }
  ctx.restore();
}

// Correlation panel, laid out like Fig 2A/B of the paper: C(r) (orientation, red) and C_sp(r)
// (speed, blue) against distance r up to the flock size L, with the zero crossings ξ marked.
let showPanel = params.has('stats') || params.has('debug');
const FONT = '11px ui-monospace, Menlo, monospace';
const fmt = (v, d = 1) => Number.isFinite(v) ? v.toFixed(d) : '—';
function drawPanel() {
  const pw = 380, ph = 262, pad = 12, x0 = W - pw - 14, y0 = 14;
  const gx = x0 + 34, gy = y0 + 24, gw = pw - 34 - pad, gh = 108;
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,20,.72)';
  ctx.beginPath(); ctx.roundRect(x0, y0, pw, ph, 8); ctx.fill();
  ctx.font = FONT; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,238,220,.9)'; ctx.textAlign = 'left';
  ctx.fillText('CORRELATION  C(r)  ·  Cavagna et al. 2010', x0 + pad, y0 + 11);

  const Y = c => gy + gh * (1 - (clamp(c, -1, 1) + 1) / 2);
  ctx.strokeStyle = 'rgba(255,238,220,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(gx, Y(1)); ctx.lineTo(gx, Y(-1)); ctx.lineTo(gx + gw, Y(-1)); ctx.stroke();
  ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(gx, Y(0)); ctx.lineTo(gx + gw, Y(0)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,238,220,.55)'; ctx.textAlign = 'right';
  ctx.fillText('1', gx - 5, Y(1)); ctx.fillText('0', gx - 5, Y(0)); ctx.fillText('-1', gx - 5, Y(-1));

  if (corr.samples) {
    const X = r => gx + gw * r / corr.L;
    const series = (C, col) => {
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.2; ctx.beginPath();
      let first = true;
      for (let b = 0; b < NBIN; b++) {
        if (Number.isNaN(C[b])) continue;
        const sx = X((b + .5) * corr.dr), sy = Y(C[b]);
        if (first) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); first = false;
      }
      ctx.stroke();
      for (let b = 0; b < NBIN; b++) if (!Number.isNaN(C[b])) { ctx.beginPath(); ctx.arc(X((b + .5) * corr.dr), Y(C[b]), 1.8, 0, TAU); ctx.fill(); }
    };
    const xiMark = (xi, col) => {
      if (!Number.isFinite(xi)) return;
      ctx.strokeStyle = col; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(xi), Y(1)); ctx.lineTo(X(xi), Y(-1)); ctx.stroke(); ctx.setLineDash([]);
    };
    series(corr.Csp, 'rgba(96,150,240,.9)'); series(corr.C, 'rgba(240,86,74,.95)');
    xiMark(corr.xiSp, 'rgba(96,150,240,.6)'); xiMark(corr.xi, 'rgba(240,86,74,.7)');

    ctx.fillStyle = 'rgba(255,238,220,.55)'; ctx.textAlign = 'center';
    ctx.fillText('0', gx, gy + gh + 9); ctx.fillText(`r  (m)`, gx + gw / 2, gy + gh + 9); ctx.fillText(fmt(corr.L * M, 0), gx + gw, gy + gh + 9);

    const ty = gy + gh + 26, lh = 15;
    const line = (i, label, val, col) => {
      ctx.textAlign = 'left'; ctx.fillStyle = col || 'rgba(255,238,220,.6)'; ctx.fillText(label, x0 + pad, ty + i * lh);
      ctx.textAlign = 'right'; ctx.fillStyle = col || 'rgba(255,238,220,.92)'; ctx.fillText(val, x0 + pw - pad, ty + i * lh);
    };
    line(0, `N ${N}   L flock size`, `${fmt(corr.L * M)} m`);
    line(1, 'Φ polarization (Eq 1) · paper 0.96', `${fmt(corr.phi, 3)}  ⟨${fmt(corr.avgPhi, 3)}⟩`);
    line(2, 'speed  ⟨|v|⟩ ± σ   ·   |u| rms', `${fmt(corr.speed * M)} ± ${fmt(corr.sigSpeed * M)}   ${fmt(corr.rmsU * M)} m/s`);
    line(3, 'ξ orientation · paper ξ/L 0.35', `${fmt(corr.xi * M)} m   ξ/L ${fmt(corr.xi / corr.L, 2)} ⟨${fmt(corr.avgXiL, 2)}⟩`, 'rgba(240,120,110,.95)');
    line(4, 'ξ speed · paper ξ/L 0.36', `${fmt(corr.xiSp * M)} m   ξ/L ${fmt(corr.xiSp / corr.L, 2)} ⟨${fmt(corr.avgXiSpL, 2)}⟩`, 'rgba(130,170,245,.95)');
    line(5, 'nearest neighbour · noise', `${fmt(stats.nn * M, 2)} m   ${fmt(NOISE_K, 2)}×`);
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,238,220,.38)';
    ctx.fillText('C to hide · ?noise= ?n= ?seed=', x0 + pad, ty + 6 * lh);
  } else {
    ctx.fillStyle = 'rgba(255,238,220,.5)'; ctx.textAlign = 'left'; ctx.fillText('sampling…', gx, gy + gh / 2);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- input, loop
addEventListener('resize', layout);
addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; lastMove = performance.now();
}, { passive: true });
addEventListener('pointerdown', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; lastMove = performance.now();
  launchFalcon(e.clientX, e.clientY);
});
let halted = params.has('halt'), stepOnce = false;   // ?halt: start paused (frame-exact captures step with "." from here)
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'c') showPanel = !showPanel;
  else if (k === 'i') showInset = !showInset;
  else if (k === 'p') halted = !halted;
  else if (k === '.' && halted) stepOnce = true;
});

document.getElementById('hint').textContent = `${N} starlings · move to lure · click to loose a falcon · C for correlations · I for the view from above`;
setTimeout(() => document.getElementById('hud').classList.add('dim'), 9000);

layout();
initFlock();

let simT = 0;
const warm = +params.get('warm') || 0;
for (let s = 0; s < warm * 60; s++) { simT += 1 / 60; step(1 / 60, simT); }
if (params.has('falcon')) launchFalcon(null);

let dbg = null;
if (params.has('debug')) {
  dbg = document.createElement('pre'); dbg.id = 'dbg'; document.body.appendChild(dbg);
  window.murm = { step, analyse, draw, stats, corr, px, py, pz, vx, vy, vz, N, M, fal, huntLog, alarm, wT, wL, wP, wS, bank, size, dodge,
    get batch() { return BATCH; }, set batch(v) { BATCH = v; }, get attSD() { return ATT_SD; }, set attSD(v) { ATT_SD = v; }, att, attV,
    get gc() { return [gcx, gcy, gcz]; }, get gv() { return [gvx, gvy, gvz]; }, get simT() { return simT; }, get yaw() { return yaw; }, get yawMax() { return yawMax; }, follow: FOLLOW, life: LIFE,
    consts: { SPAN, FALCON_SPAN, DODGE_W, DODGE_T, R_FLEE, CONTACT, WAVE_ROLL },
    cam: { get UM() { return UM; }, get VT() { return VT; }, get VB() { return VB; }, get ct() { return ct; }, get st() { return st; },
      get f() { return f; }, get cx() { return cx; }, get cy() { return cy; }, get W() { return W; }, get H() { return H; }, get sizeK() { return sizeK; },
      get HORIZON() { return HORIZON; }, CAM_H, ZMIN, ZMAX } };
}

const ANALYSE_EVERY = N > 1500 ? 1 : .5;       // seconds of simulated time between O(N²) correlation passes
let last = performance.now() / 1000, frames = 0, fpsT = 0, fps = 0;
function loop(ms) {
  const now = ms / 1000, dt = Math.min(now - last, 1 / 30); last = now;
  if (stepOnce) { simT += 1 / 60; step(1 / 60, simT); stepOnce = false; }
  else if (dt > 0 && !halted) { simT += dt; step(dt, simT); }
  if (showPanel && simT - corr.t >= ANALYSE_EVERY) analyse(simT);
  draw(dt);
  if (dbg) {
    frames++; fpsT += dt;
    if (fpsT > .5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
    dbg.textContent = `t ${simT.toFixed(1)}  fps ${fps.toFixed(0)}  pol ${stats.pol.toFixed(2)}  nn ${stats.nn.toFixed(1)}  out ${stats.out}  falcon ${fal.on}`;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
