<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmuration</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a1a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: fixed; left: clamp(16px, 3vw, 34px); bottom: clamp(14px, 2.6vh, 28px);
    font: 500 11px/1.6 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: rgba(255, 226, 200, .7);
    pointer-events: none; user-select: none; transition: opacity 2.4s ease;
  }
  .hud b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .34em; color: rgba(255, 238, 220, .95); }
  .hud a { pointer-events: auto; color: inherit; text-decoration: underline; display: block; margin-top: 5px; }
  .hud.dim { opacity: .38; }
  #dbg { position: fixed; top: 8px; left: 8px; margin: 0; font: 11px/1.4 ui-monospace, monospace; color: #fff; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud"><b>Murmuration</b><span id="hint"></span><a href="motion-lab.html" target="_blank">Explore bird motion ↗</a></div>
<script src="motion/motion-data.js"></script>
<script src="motion/motion.js"></script>
<script>
(() => {
'use strict';
// Flocking model with the observables of Cavagna et al., "Scale-free correlations in
// starling flocks", PNAS 107:11865 (2010).  Equation numbers below refer to that paper.
//   Eq 1   polarization        Φ = |(1/N) Σ v_i/|v_i||
//   Eq 2   velocity fluctuation u_i = v_i − (1/N) Σ v_k          (Eq 3: Σ u_i = 0)
//   Eq 4   correlation         C(r) = (1/c0) Σ_ij u_i·u_j δ(r−r_ij) / Σ_ij δ(r−r_ij), c0 = (1/N) Σ |u_i|² so C(0)=1
//   Eq 5   correlation length  C(ξ) = 0  (a zero must exist: Eq 14 says ∫ numerator dr = |Σ u_i|² − N c0 = −N c0 < 0)
//   Eq 15  speed correlation   same as Eq 4 with φ_i = |v_i| − (1/N) Σ |v_k|   (Eq 16)
//   result ξ ≈ 0.35 L (orientation), ξ_sp ≈ 0.36 L (speed), Φ = 0.96 ± 0.03; interaction is topological (~7 birds)
// Scale-free here means ξ ∝ L and C(r) keeping one shape in r/L. Two things in the model produce it:
//   1. nothing restores a single bird's heading or speed to a preferred value: steering, levelling
//      and the speed hold act on flock means, so a fluctuation can only relax through the neighbours;
//   2. the behavioural noise is persistent (NOISE_TAU) and alignment is stiff (W_ALI), so the long
//      wavelengths carry the fluctuation (white noise leaves it in a neighbour-sized blob).
// Measured, undisturbed (?calm), N = 100…1600: L = 17…39 m, ξ/L = 0.33–0.38, ξ_sp/L = 0.32–0.36.
// World unit: 1 u = 0.5 m, so CRUISE 23 u/s ≈ 11.5 m/s (paper Fig 1C), separation 5 u ≈ 2.5 m.
// Press C to toggle the correlation panel (?stats opens it; ?debug adds the frame counter).

const params = new URLSearchParams(location.search);
const Motion = MurmurationMotion, legacyMotion = params.get('motion') === 'legacy';
const gaits = [];
const revision = Object.freeze({ base: '0d3078f2841f022a78fd6a1c478d9540fedab404', worktree: '~/prj/murmuration-milestone' });
const motionAssets = Object.freeze({ starling: Motion.data.species.starling.inputs, falcon: Motion.data.species.falcon.inputs });
const motionExports = Object.freeze({
  'motion-data.js': '744e92d6f4a41b651723e499025a25b05e1eaef2d77f02d89a81bca57072e1aa',
  'motion.js': 'ce19dd0dd8eacfdb710ad6cb928735e70c296a8ae689b32ca224502c1e353351',
  'starling-motion.json': 'd20c334027408e39f66486e80d772fe9d2ee7ba174bca0e1a5627079d507e6e7',
  'falcon-motion.json': 'f93b76dc90e9b56e91a56b94c53e010a87f51a3f0f022f7247480f933bde139e',
  'birds-motion.blend': 'da126a4d14e2b646d428941c320b3a771a43426ca2bb0beb183e6286a9d457f8',
});
const N = Math.min(3000, Math.max(20, +params.get('n') || 400));
const K = 7;                                   // topological neighbours (Ballerini et al. 2008: 6–7, not a radius)
const TAU = Math.PI * 2;

const rng = s => () => {                       // mulberry32
  s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const seed = params.has('seed') ? +params.get('seed') : (Math.random() * 4294967296) >>> 0;
const rand = rng(seed);
let gSpare = NaN;
const gauss = () => {                          // Box–Muller, N(0,1)
  if (!Number.isNaN(gSpare)) { const v = gSpare; gSpare = NaN; return v; }
  let u1 = rand(); while (u1 <= 1e-12) u1 = rand();
  const r = Math.sqrt(-2 * Math.log(u1)), a = TAU * rand();
  gSpare = r * Math.sin(a); return r * Math.cos(a);
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const sky = document.createElement('canvas');
const sctx = sky.getContext('2d');
// Photographic backdrop: murmuration-sky.jpg is an evening panorama (Poly Haven "Scythian Tombs 2",
// CC0) reprojected for this camera, with the horizon at 80 % of its height and a 46° vertical field
// of view. Until it loads, if it is missing, or with ?painted, the painted sky below is used.
const skyImg = document.createElement('img');
let skyReady = false;
if (!params.has('painted')) {
  skyImg.onload = () => { skyReady = true; paintSky(); fresh = true; };
  skyImg.src = 'murmuration-sky.jpg';
}

// ---------------------------------------------------------------- camera
// World: x right, y up, z away from the viewer. The camera stands on the ground looking
// at the flock, pitched up so the horizon sits low in the frame.
const CAM_H = 2;
const ZMIN = 75, ZMAX = 200;
let W, H, dpr, f, cx, cy, HORIZON, ct, st, UM, VT, VB, sizeK;

function layout() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = sky.width = Math.round(W * dpr);
  canvas.height = sky.height = Math.round(H * dpr);
  f = Math.min((H / 2) / Math.tan(23 * Math.PI / 180), (W / 2) / Math.tan(21 * Math.PI / 180));
  cx = W / 2; cy = H / 2;
  HORIZON = 0.8 * H;
  const pitch = Math.atan((HORIZON - cy) / f);
  ct = Math.cos(pitch); st = Math.sin(pitch);
  UM = 0.8 * (W / 2) / f;                      // flock stays inside these view tangents
  VT = (cy - 0.13 * H) / f;
  VB = (cy - 0.62 * H) / f;
  sizeK = clamp(1150 / f, 1, 1.7);
  paintSky();
  fresh = true;
}

let _x = 0, _y = 0, _z = 0;
function P(x, y, z) {                          // world -> screen, result in _x _y (px) and _z (depth)
  const yr = y - CAM_H;
  _z = yr * st + z * ct;
  const k = f / _z;
  _x = cx + x * k;
  _y = cy - (yr * ct - z * st) * k;
}
function screenToWorld(sx, sy, depth, out) {
  const dx = (sx - cx) / f, dy = (cy - sy) / f;
  out.x = dx * depth;
  out.y = CAM_H + (dy * ct + st) * depth;
  out.z = (ct - dy * st) * depth;
}

// ---------------------------------------------------------------- scenery
function paintSky() {
  const g = sctx, r = rng(7);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const hz = HORIZON;

  if (skyReady) {                              // same focal length and horizon as the camera, scaled up only to cover
    const iw = skyImg.naturalWidth, ih = skyImg.naturalHeight, fi = (ih / 2) / Math.tan(23 * Math.PI / 180);
    const k = Math.max(f / fi, W / iw, H / ih);
    g.drawImage(skyImg, cx - iw * k / 2, hz - .8 * ih * k, iw * k, ih * k);
    const vg = g.createRadialGradient(cx, cy * .95, Math.min(W, H) * .35, cx, cy, Math.hypot(W, H) * .62);
    vg.addColorStop(0, 'rgba(6,3,14,0)'); vg.addColorStop(1, 'rgba(6,3,14,.35)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    return;
  }

  const grad = g.createLinearGradient(0, 0, 0, hz);
  [[0, '#080a22'], [.26, '#1b1a4c'], [.52, '#573a7c'], [.74, '#bf5a62'], [.9, '#f0955b'], [1, '#ffc87c']]
    .forEach(([o, c]) => grad.addColorStop(o, c));
  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  for (let i = 0; i < 150; i++) {              // first stars
    const y = Math.pow(r(), 1.9) * hz * .6, x = r() * W;
    g.fillStyle = `rgba(255,240,228,${(.1 + r() * .5) * (1 - y / (hz * .6))})`;
    g.fillRect(x, y, r() < .12 ? 1.4 : .8, r() < .12 ? 1.4 : .8);
  }

  const sx = W * .7, sy = hz - H * .012;       // sun sinking behind the ridge
  let rg = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * .6);
  rg.addColorStop(0, 'rgba(255,214,150,.8)'); rg.addColorStop(.28, 'rgba(255,150,100,.3)'); rg.addColorStop(1, 'rgba(255,120,110,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  rg = g.createRadialGradient(sx, sy, 0, sx, sy, H * .06);
  rg.addColorStop(0, 'rgba(255,250,232,1)'); rg.addColorStop(.6, 'rgba(255,228,176,.95)'); rg.addColorStop(1, 'rgba(255,196,128,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(sx, sy, H * .06, 0, TAU); g.fill();

  const blob = (x, y, w, h, c, a) => {         // soft streak of cloud
    g.save(); g.translate(x, y); g.scale(w, h);
    const q = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    q.addColorStop(0, `rgba(${c},${a})`); q.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = q; g.beginPath(); g.arc(0, 0, 1, 0, TAU); g.fill(); g.restore();
  };
  for (let i = 0; i < 26; i++) {
    const t = .3 + .64 * Math.pow(r(), .85), y = hz * t, w = W * (.08 + r() * .24);
    const c = [Math.round(120 + 135 * t), Math.round(80 + 70 * t), Math.round(150 - 40 * t)].join(',');
    const a = .1 + r() * .16;
    for (let k = 0; k < 4; k++) blob(r() * W + (r() - .5) * w, y + (r() - .5) * H * .02, w * (.4 + r() * .6), w * (.02 + r() * .03), c, a);
  }

  const wob = (u, p) => .5 + .5 * (.5 * Math.sin(u * 5.1 + p[0]) + .32 * Math.sin(u * 11.7 + p[1]) + .18 * Math.sin(u * 27 + p[2]));
  const ridge = (base, amp, jag, fill, p) => {
    g.fillStyle = fill; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 3; x += 3) g.lineTo(x, base - wob(x / W, p) * amp - r() * jag);
    g.lineTo(W + 3, H); g.closePath(); g.fill();
  };
  const far = g.createLinearGradient(0, hz - H * .07, 0, hz + H * .03);
  far.addColorStop(0, '#7a4262'); far.addColorStop(1, '#3a2148');
  ridge(hz + H * .004, H * .05, 0, far, [1, 2, 3]);
  ridge(hz + H * .02, H * .045, 1, '#26173a', [4, 5, 6]);
  ridge(hz + H * .04, H * .035, 5, '#130c22', [7, 8, 9]);
  const mead = g.createLinearGradient(0, hz + H * .06, 0, H);
  mead.addColorStop(0, '#1a1030'); mead.addColorStop(.35, '#0d0919'); mead.addColorStop(1, '#06040b');
  g.fillStyle = mead; g.fillRect(0, hz + H * .06, W, H);

  for (let i = 0; i < 8; i++) {                // poplars
    const x = r() * W, th = H * (.1 + r() * .08), tw = th * (.06 + r() * .03), by = hz + H * .08;
    g.fillStyle = '#0a0711'; g.beginPath(); g.moveTo(x, by - th);
    g.quadraticCurveTo(x + tw * 1.5, by - th * .5, x + tw * .4, by); g.lineTo(x - tw * .4, by);
    g.quadraticCurveTo(x - tw * 1.5, by - th * .5, x, by - th); g.fill();
  }
  g.strokeStyle = '#050309'; g.lineCap = 'round';
  for (let i = 0; i < W / 3; i++) {            // reeds
    const x = r() * W, h = H * (.03 + .13 * r() * r() * r()), lean = (r() - .5) * h * .5;
    g.lineWidth = .8 + r() * 1.3;
    g.beginPath(); g.moveTo(x, H + 2); g.quadraticCurveTo(x + lean * .2, H - h * .6, x + lean, H - h); g.stroke();
  }

  const vg = g.createRadialGradient(cx, cy * .95, Math.min(W, H) * .35, cx, cy, Math.hypot(W, H) * .62);
  vg.addColorStop(0, 'rgba(6,3,14,0)'); vg.addColorStop(1, 'rgba(6,3,14,.5)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  const nc = document.createElement('canvas'); nc.width = nc.height = 96;   // grain to dither the gradients
  const nx = nc.getContext('2d'), id = nx.createImageData(96, 96);
  for (let i = 0; i < id.data.length; i += 4) { id.data[i] = id.data[i + 1] = id.data[i + 2] = r() * 255; id.data[i + 3] = 10; }
  nx.putImageData(id, 0, 0);
  g.fillStyle = g.createPattern(nc, 'repeat'); g.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------- flock
const M = 0.5;                                 // metres per world unit (used for the readout only)
const CRUISE = 23, VMIN = 12, VMAX = 30, MAX_ACC = 16;
const RS = 5, RN = 38;                         // separation radius / sanity cutoff on the topological neighbours
const W_SEP = 20, W_ALI = 18, W_COH = 6, W_TGT = 8, W_GLOBAL = .12, W_SPD = 1.5, W_SPD4 = .002, W_LEVEL = .9, W_FLEE = 70;
const R_FLEE = 65;
const R_FLOCK = 20 * Math.cbrt(N / 400), W_REJOIN = 2;   // beyond R_FLOCK (∝ N^⅓ at fixed density) birds head back, 1/s
const FRAME_CAP = 20;                          // largest framing acceleration, u/s²
const SPAN = 1.63;                             // u, full-spread span: about twice life size (0.382 m), like the falcon
// Wingbeat and intermittent flight (starling/refs/pose_spec.md): 10–14 Hz (BG13, RA01). At 10–12 m/s a
// starling flaps in bursts of about 12–15 beats, then pauses 0.6–1 s (RA01 Table 1); most pauses are
// glides, and bounds with the wings folded get commoner with speed (TO95). P_BOUND is an estimate
// fitted to that trend. A frightened bird flaps without pausing. This is drawing only: it uses its own
// random stream, so a seeded run moves exactly as before.
const BEAT_HZ = [10, 14], BURST = [10, 16], PAUSE = [.5, 1], ALARM_PAUSE = .2;
const P_BOUND = v => clamp(.25 + (v * M - 10) / 16, .1, .6);   // v in u/s
const wrand = rng((params.has('seed') ? +params.get('seed') ^ 0x9E3779B9 : Math.random() * 4294967296) >>> 0);
// Behavioural noise: an Ornstein–Uhlenbeck acceleration per bird, stationary std NOISE (u/s²),
// correlation time NOISE_TAU. The paper argues the noise level, not the rule, sets the order and
// the correlation range, so ?noise=<factor> scales it. Measured on undisturbed flight (?calm, 400 birds):
//   0.5 → Φ ≈ 1.000, |u| ≈ 0.4 m/s, ξ/L ≈ 0.41 (rigid);  1 → Φ ≈ 0.99–1.00, |u| ≈ 1.0–1.5 m/s, ξ/L ≈ 0.35;
//   1.5 → Φ ≈ 0.99, |u| ≈ 1.9 m/s, the flock stretches to L ≈ 31 m and the far-side anticorrelation fades.
// A falcon strike dips Φ to 0.7–0.95 for a few seconds and can split the flock briefly.
// NOISE_TAU must be long against 1/(D k²) for the modes that matter (D ≈ W_ALI · 3.5 u², k ≈ π/L):
// with τ = 0.5 s and W_ALI = 4.5 the same noise gave C(r) ≈ 0 beyond 0.15 L.
const NOISE_K = params.has('noise') ? Math.max(0, +params.get('noise')) : 1;
const NOISE = 9 * NOISE_K, NOISE_TAU = 4;

const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N), vz = new Float32Array(N);
const ax = new Float32Array(N), ay = new Float32Array(N), az = new Float32Array(N);
const nzx = new Float32Array(N), nzy = new Float32Array(N), nzz = new Float32Array(N);   // OU noise state
const bank = new Float32Array(N), alarm = new Float32Array(N);
const phase = new Float32Array(N), freq = new Float32Array(N), size = new Float32Array(N);
const paused = new Uint8Array(N), pkind = new Uint8Array(N), ptime = new Float32Array(N), pw = new Float32Array(N);   // pkind 1 glide, 2 bound; pw 0 flapping .. 1 in the pause pose
const nbD = new Float32Array(K), nbI = new Int32Array(K);
const tgt = { x: 0, y: 0, z: 0 }, tmp = { x: 0, y: 0, z: 0 };
let gcx = 0, gcy = 0, gcz = 0, gvx = 0, gvy = 0, gvz = 0, lure = 0, lastMove = -1e9;
const ptr = { x: 0, y: 0 };
let stats = { pol: 0, nn: 0, out: 0 };

const way = { x: 0, y: 0, z: 0, ox: 0, oy: 0, oz: 0, hx: 1, hy: 0, hz: 0, t: -1e9 };
function nextWaypoint(t) {                     // usually the far side of the sky, sometimes a loop back
  const hl = Math.hypot(gvx, gvy, gvz) + 1e-6; // heading at the moment of the switch (drives the ripple lag)
  way.hx = gvx / hl; way.hy = gvy / hl; way.hz = gvz / hl;
  way.ox = way.x; way.oy = way.y; way.oz = way.z;
  P(gcx, gcy, gcz);
  const side = (_x > cx) === (rand() < .75) ? -1 : 1;
  screenToWorld(cx + side * W * (.1 + .2 * rand()), H * (.27 + .2 * rand()), 125 + 70 * rand(), way);
  if (way.t < -1e8) { way.ox = way.x; way.oy = way.y; way.oz = way.z; }
  way.t = t;
}

function initFlock() {
  screenToWorld(cx + W * .05, H * .4, 140, tmp);
  for (let i = 0; i < N; i++) {
    const a = (rand() - .5) * .6, s = CRUISE * (.9 + .2 * rand());
    px[i] = tmp.x + (rand() - .5) * 46; py[i] = tmp.y + (rand() - .5) * 24; pz[i] = tmp.z + (rand() - .5) * 46;
    vx[i] = s * Math.cos(a); vy[i] = (rand() - .5) * 2; vz[i] = s * Math.sin(a);
    phase[i] = rand() * TAU; freq[i] = BEAT_HZ[0] + rand() * (BEAT_HZ[1] - BEAT_HZ[0]); size[i] = .85 + .3 * rand();
    paused[i] = 0; pkind[i] = 1; pw[i] = 0; ptime[i] = wrand() * BURST[1] / freq[i];   // birds start at random points in a burst
    nzx[i] = NOISE * gauss(); nzy[i] = NOISE * gauss(); nzz[i] = NOISE * gauss();
  }
}

// ---------------------------------------------------------------- falcon
// The hunt follows falcon/refs/hunting_notes.md (§6 maps each finding onto this code). A hunt is 1–4
// strikes, about 3 on average (Rome roost; Procaccini 2011, Zoratto 2010). Each strike: take up a
// position above, beside or below the flock (50/39/11 %, between the Storms 2019 and Procaccini 2011
// tallies), stoop on the nearest bird steered by proportional navigation, a = N λ̇ × v (Brighton 2017:
// no lead and no range needed), then zoom-climb, trading the speed back for height (Dekker 2009).
// About 30 % of strikes follow the last within 5 s. A strike is logged but never takes a bird.
const fal = {
  on: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, age: 0, prey: 0, side: 1, phase: 0, fan: 0, flap: 1,
  mode: 'leave', mt: 0, kind: 0, strikes: 0, quota: 0, chain: false, lastPass: -1e9, clickPrey: -1,
  range: 1e9, pn: false, pnT: 0, pnPath: 0, peak: 0, nSum: 0, nCnt: 0, flash: false, fleeK: 0, waves: false, pulses: 0, pulseN: 0, pulseT: -1e9,
  minMiss: 1e9,
};
fal.motion = Motion.falconState(); fal.motionBank = 0;
const CALM = params.has('calm');               // ?calm: no spontaneous attacks (clicks still work)
let nextFalcon = CALM ? Infinity : 14 + rand() * 6;
const FAL_CRUISE = 30;                         // u/s, 15 m/s: shadowing flight, 1.3× the flock as in StarEscape and Mills 2018
const FAL_STOOP = [72, 52, 40];                // u/s, target speed from above (36 m/s, inside Alerstam's 31–39 m/s radar stoops), beside, below
const FAL_G = 19.6, FAL_THRUST = 6, FAL_DRAG = 15;   // u/s²: gravity at 0.5 m/u; flapping gain and braking along the path (estimates)
const PN_N = 2.6, PN_DELAY = .05, LOS_ERR = .007;   // median gain of wild peregrines (Brighton 2017). As in Mills 2018: the line of sight is seen
                                               // with an error of up to 0.007 rad and its rate is the difference of two sightings PN_DELAY apart, used PN_DELAY late
const TURN_IN = .8;                            // cos of the angle off the line of sight below which the falcon first turns in by pure pursuit
const PN_ACC = 49;                             // u/s²: turns of at most about 2.5 g, as measured in stoops (Brighton 2017)
const STAGE_OFF = 110, STAGE_UP = [90, 0, -50];   // u: where the falcon waits, 55 m beside the flock on its own side and 45 m above, level, or 25 m below;
                                               // it gives a guided final approach of about 75 m (47–114 m measured, Brighton 2017)
const CONTACT = .4;                            // u: a pass within 0.2 m counts as a catch, as in Mills 2018
const P_FLASH = [.35, .15, .15];               // flash expansion after ~25 % of attacks, mostly fast ones from above (Storms 2019)
const FLEE_QUIET = 0;                          // no general flight from the falcon without a flash expansion: only birds in its path dodge
// Last-moment dodge: a bird in the stooping falcon's path (within DODGE_W of its line of flight) that it
// would reach within DODGE_T turns off that line at 3.4 g, the load factor of Mills 2018's model starling.
// DODGE_T and DODGE_W are not measured. With them about 20 % of strikes and 45–50 % of hunts would end in a
// catch: above the 23 % of hunts seen in Rome, close to the 26–31 % per attack of Mills 2018's simulations.
// No catch is drawn; murmuration-falcon.js reports the rate.
const DODGE_T = .5, DODGE_ACC = 67, DODGE_W = 4;
const P_CHAIN = .3;                            // chance the next strike follows straight after the climb
const P_WAVES = .4, PULSE_GAP = .8;            // orientation waves in 36–42 % of hunts, pulses ~0.8 s apart (Procaccini 2011)
const huntLog = [];                            // strikes, pulses and hunts, for murmuration-falcon.js
const logEvent = e => { huntLog.push(e); if (huntLog.length > 400) huntLog.shift(); };
const losQ = Array.from({ length: 32 }, () => ({ t: -1e9, x: 0, y: 0, z: 0 }));
let losHead = 0, pulseId = 0;
const stage = { x: 0, y: 0, z: 0 };

function launchFalcon(clickX, clickY) {
  if (fal.on) return;
  fal.on = true; fal.age = 0; fal.phase = 0; fal.strikes = 0; fal.fan = 0; fal.flap = 1; fal.minMiss = 1e9;
  fal.motion = Motion.falconState(); fal.motionBank = 0;
  const q = rand(); fal.quota = q < .1 ? 1 : q < .35 ? 2 : q < .7 ? 3 : 4;   // 1–4 strikes, mean 2.85
  fal.waves = rand() < P_WAVES;
  fal.side = clickX == null ? (rand() < .5 ? -1 : 1) : (clickX < cx ? 1 : -1);
  screenToWorld(fal.side > 0 ? W * 1.12 : -W * .12, H * (.18 + .12 * rand()), 190 + 30 * rand(), tmp);
  fal.x = tmp.x; fal.y = tmp.y; fal.z = tmp.z;
  const dx = gcx - fal.x, dy = gcy - fal.y, dz = gcz - fal.z, d = Math.hypot(dx, dy, dz);
  fal.vx = dx / d * FAL_CRUISE; fal.vy = dy / d * FAL_CRUISE; fal.vz = dz / d * FAL_CRUISE;
  fal.clickPrey = -1;
  if (clickX != null) {                        // a click sends the falcon straight at the bird nearest the click
    let best = 1e9;
    for (let i = 0; i < N; i++) {
      P(px[i], py[i], pz[i]);
      const d2 = (_x - clickX) ** 2 + (_y - clickY) ** 2;
      if (d2 < best) { best = d2; fal.clickPrey = i; }
    }
    fal.kind = fal.y > gcy + 15 ? 0 : fal.y < gcy - 15 ? 2 : 1;
    startStoop(0);
  } else startPosition();
}

function startPosition() {
  const r = rand();
  fal.kind = r < .5 ? 0 : r < .89 ? 1 : 2;
  fal.mode = 'position'; fal.mt = 0;
}

function startStoop(t) {
  let best = 1e9;
  if (fal.clickPrey >= 0) { fal.prey = fal.clickPrey; fal.clickPrey = -1; }
  else for (let i = 0; i < N; i++) {           // lock on to the nearest bird and keep it for the whole pass
    const dd = (px[i] - fal.x) ** 2 + (py[i] - fal.y) ** 2 + (pz[i] - fal.z) ** 2;
    if (dd < best) { best = dd; fal.prey = i; }
  }
  fal.mode = 'stoop'; fal.mt = 0; fal.pn = false; fal.pnT = 0; fal.pnPath = 0; fal.range = 1e9; fal.peak = 0; fal.nSum = 0; fal.nCnt = 0;
  fal.flash = rand() < P_FLASH[fal.kind];
  fal.pulses = 0; fal.pulseN = fal.waves ? 2 + (rand() < .5 ? 1 : 0) : 0;
  for (const q of losQ) q.t = -1e9;
  logEvent({ type: 'stoop', t, kind: fal.kind, prey: fal.prey, flash: fal.flash });
}

function endStoop(t) {
  const sp = Math.hypot(fal.vx, fal.vy, fal.vz);
  logEvent({ type: 'strike', t, kind: fal.kind, miss: fal.range, peak: fal.peak, n: fal.nCnt ? fal.nSum / fal.nCnt : NaN,
    contact: fal.range < CONTACT, dur: fal.mt, pnDur: fal.pnT, pnPath: fal.pnPath, flash: fal.flash, speedAtPass: sp });
  fal.minMiss = Math.min(fal.minMiss, fal.range);
  fal.strikes++; fal.lastPass = t;
  fal.mode = 'climb'; fal.mt = 0; fal.chain = rand() < P_CHAIN;
}

function seedPulse(t) {                        // the wave starts at the bird nearest the falcon
  let best = 1e9, k = 0;
  for (let i = 0; i < N; i++) {
    const dd = (px[i] - fal.x) ** 2 + (py[i] - fal.y) ** 2 + (pz[i] - fal.z) ** 2;
    if (dd < best) { best = dd; k = i; }
  }
  triggerWave(k, 1, ++pulseId);
  fal.pulses++; fal.pulseT = t;
  logEvent({ type: 'pulse', t, id: pulseId, bird: k, x: px[k], y: py[k], z: pz[k] });
}

// Steering toward a velocity: the falcon's own flight between stoops (not PN).
function seek(vxT, vyT, vzT, rate, cap) {
  let aX = (vxT - fal.vx) * rate, aY = (vyT - fal.vy) * rate, aZ = (vzT - fal.vz) * rate;
  const am = Math.hypot(aX, aY, aZ);
  if (am > cap) { aX *= cap / am; aY *= cap / am; aZ *= cap / am; }
  return [aX, aY, aZ, am];
}

function updateFalcon(dt, t) {
  if (!fal.on) { if (t > nextFalcon) launchFalcon(null); return; }
  fal.age += dt; fal.mt += dt;
  const sp = Math.hypot(fal.vx, fal.vy, fal.vz) + 1e-6;
  let aX = 0, aY = 0, aZ = 0, turn = 0;

  if (fal.mode === 'stoop') {
    const i = fal.prey;
    const rx = px[i] - fal.x, ry = py[i] - fal.y, rz = pz[i] - fal.z, r2 = rx * rx + ry * ry + rz * rz + 1e-6, r = Math.sqrt(r2);

    {                                          // a noisy sighting of the line of sight
      let ex = rand() - .5, ey = rand() - .5, ez = rand() - .5;
      const ux = rx / r, uy = ry / r, uz = rz / r, ed = ex * ux + ey * uy + ez * uz;
      ex -= ed * ux; ey -= ed * uy; ez -= ed * uz;

    }

      for (let k = 0; k < losQ.length; k++) { const q = losQ[(losHead - k + losQ.length) % losQ.length]; if (q.t <= t - age) return q; }
      return null;
    };
    const A = sighting(2 * PN_DELAY), B = sighting(PN_DELAY);   // λ̇ ≈ û₁ × û₂ / Δt
    const L = A && B ? { x: (A.y * B.z - A.z * B.y) / PN_DELAY, y: (A.z * B.x - A.x * B.z) / PN_DELAY, z: (A.x * B.y - A.y * B.x) / PN_DELAY } : null;

    // ~37° of the line of sight; from then on it holds proportional navigation to the end.
    const cosd = (rx * fal.vx + ry * fal.vy + rz * fal.vz) / (r * sp);
    if (!fal.pn && cosd > TURN_IN) fal.pn = true;
    if (!fal.pn) {
      aX = (rx / r * sp - fal.vx) * 3; aY = (ry / r * sp - fal.vy) * 3; aZ = (rz / r * sp - fal.vz) * 3;
    } else if (L) {
      aX = PN_N * (L.y * fal.vz - L.z * fal.vy); aY = PN_N * (L.z * fal.vx - L.x * fal.vz); aZ = PN_N * (L.x * fal.vy - L.y * fal.vx);
      fal.nSum += PN_N; fal.nCnt++; fal.pnT += dt; fal.pnPath += sp * dt;
    }
    turn = Math.hypot(aX, aY, aZ);
    if (turn > PN_ACC) { aX *= PN_ACC / turn; aY *= PN_ACC / turn; aZ *= PN_ACC / turn; turn = PN_ACC; }
    // Speed along the path: gravity in the dive, a little flapping, braking above the target speed.
    const descent = -fal.vy / sp;
    const along = clamp((FAL_STOOP[fal.kind] - sp) * 1.5, -FAL_DRAG, FAL_THRUST + FAL_G * descent);
    aX += along * fal.vx / sp; aY += along * fal.vy / sp; aZ += along * fal.vz / sp;
    fal.peak = Math.max(fal.peak, sp);
    if (fal.pulses < fal.pulseN && r < R_FLEE && t - fal.pulseT > PULSE_GAP) seedPulse(t);

    else if ((fal.range < 40 && r > fal.range + 3 && fal.mt > 1) || fal.mt > 8) endStoop(t);   // past the closest approach

    const hl = Math.hypot(fal.vx, fal.vz) + 1e-6, c = Math.cos(.7), s = Math.sin(.7);

    if (fal.mt > (fal.chain ? 1.2 : 2)) {        // a chained strike mounts briefly and swoops again
      if (fal.strikes >= fal.quota || fal.age > 60) { fal.mode = 'leave'; logEvent({ type: 'hunt', t, strikes: fal.strikes, waves: fal.waves, minMiss: fal.minMiss, contact: fal.minMiss < CONTACT }); }

  } else if (fal.mode === 'position') {        // wait beside the flock on the falcon's side, a little ahead of it
    let hx = gvx, hz = gvz; const hl = Math.hypot(hx, hz) + 1e-6; hx /= hl; hz /= hl;
    let lx = -hz, lz = hx;

    if ((d < 20 || fal.mt > 6) && t - fal.lastPass > 5) startStoop(t);
  } else {                                     // leave
    screenToWorld(fal.side > 0 ? -W * .35 : W * 1.35, H * .1, 200, tmp);
    const dx = tmp.x - fal.x, dy = tmp.y - fal.y, dz = tmp.z - fal.z, d = Math.hypot(dx, dy, dz) + 1e-6;

  fal.fan += (Math.min(1, turn / 55) - fal.fan) * Math.min(1, dt * 4);   // tail spreads in hard turns
  fal.flap += ((fal.mode === 'position' || fal.mode === 'leave' ? 1 : 0) - fal.flap) * Math.min(1, dt * 3);   // flaps between stoops, glides and dives in them
  fal.phase += dt * TAU * 5.1;                 // 5.1 Hz wingbeat (falcon/refs/pose_spec.md)
  fal.fleeK += ((fal.mode === 'stoop' && fal.flash ? 1 : FLEE_QUIET) - fal.fleeK) * Math.min(1, dt * 6);
  fal.vx += aX * dt; fal.vy += aY * dt; fal.vz += aZ * dt;

  Motion.updateFalcon(fal.motion, dt, fal.mode, Math.hypot(fal.vx, fal.vy, fal.vz) * M, turn / 55);
  P(fal.x, fal.y, fal.z);
  if (fal.age > 75 || (fal.mode === 'leave' && (_x < -W * .1 || _x > W * 1.1))) {
    if (fal.mode !== 'leave') logEvent({ type: 'hunt', t, strikes: fal.strikes, waves: fal.waves, minMiss: fal.minMiss, contact: fal.minMiss < CONTACT, cut: true });
    fal.on = false; nextFalcon = CALM ? Infinity : t + 28 + rand() * 24;

}

// Orientation waves (Procaccini 2011, Hemelrijk 2015): a bird rolls away from the falcon and back
// (0.25 s out, 0.30 s back), and each neighbour copies the roll WAVE_HOP later: 76 ms reaction plus
// about 50 ms to identify the cue. A bird that has rolled ignores the wave for WAVE_REFRACT.
const WAVE_HOP = .126, WAVE_REFRACT = 1, WAVE_DECAY = .97, WAVE_MIN = .3, WAVE_ROLL = .8, WAVE_ALARM = .3;
const wT = new Float32Array(N).fill(1e3), wL = new Float32Array(N), wS = new Int8Array(N), wP = new Int32Array(N);   // wP: which pulse
function triggerWave(i, level, pulse) {
  wT[i] = 0; wL[i] = level; wP[i] = pulse;
  const s = Math.hypot(vx[i], vz[i]) + 1e-6;   // roll away from the falcon: right wing down if it is on the left
  wS[i] = (fal.x - px[i]) * vz[i] / s - (fal.z - pz[i]) * vx[i] / s > 0 ? -1 : 1;
  if (WAVE_ALARM * level > alarm[i]) alarm[i] = WAVE_ALARM * level;
}
function waveRoll(i) {                         // radians, drawing only
  const u = wT[i];
  const e = u < .25 ? u / .25 : u < .55 ? 1 - (u - .25) / .3 : 0;
  return e > 0 ? wS[i] * WAVE_ROLL * wL[i] * e * e * (3 - 2 * e) : 0;
}

// ---------------------------------------------------------------- simulation
function step(dt, t) {
  let sx = 0, sy = 0, sz = 0, svx = 0, svy = 0, svz = 0, ssp = 0;
  for (let i = 0; i < N; i++) { sx += px[i]; sy += py[i]; sz += pz[i]; svx += vx[i]; svy += vy[i]; svz += vz[i]; ssp += Math.hypot(vx[i], vy[i], vz[i]); }
  gcx = sx / N; gcy = sy / N; gcz = sz / N; gvx = svx / N; gvy = svy / N; gvz = svz / N;   // centre of mass and its velocity
  const gsp = ssp / N, gvl = Math.hypot(gvx, gvy, gvz) + 1e-6, hx = gvx / gvl, hy = gvy / gvl, hz = gvz / gvl;   // mean speed, flock heading

  lure += ((performance.now() - lastMove < 2600 ? 1 : 0) - lure) * Math.min(1, dt * 1.4);
  if (t - way.t > 16 || Math.hypot(gcx - way.x, gcy - way.y, gcz - way.z) < 100) nextWaypoint(t);
  if (lure > .01) screenToWorld(ptr.x, ptr.y, clamp(gcz, 100, 180), tgt);
  updateFalcon(dt, t);

  // Exact one-step update of the OU noise: x' = x e^{-dt/τ} + σ sqrt(1 − e^{-2dt/τ}) N(0,1).
  // Its stationary variance is σ² whatever the frame rate.
  const ouDecay = Math.exp(-dt / NOISE_TAU), ouKick = NOISE * Math.sqrt(1 - ouDecay * ouDecay);

  // Keep the flock in the picture by pushing the whole flock, not each bird: a common acceleration
  // turns the flock coherently (Φ unchanged), whereas per-bird shoves compressed it and scattered
  // headings every time it overshot a waypoint. The box is shrunk by the radius of gyration.
  let frX = 0, frY = 0, frZ = 0;
  {
    let r2 = 0;
    for (let i = 0; i < N; i++) r2 += (px[i] - gcx) ** 2 + (py[i] - gcy) ** 2 + (pz[i] - gcz) ** 2;
    const Rg = Math.sqrt(r2 / N);
    const yr = gcy - CAM_H, zc = yr * st + gcz * ct, yc = yr * ct - gcz * st, u = gcx / zc, v = yc / zc;
    const mu = Math.min(1.1 * Rg / zc, .4 * UM, .4 * (VT - VB)), mz = Math.min(1.1 * Rg, .4 * (ZMAX - ZMIN) / 2);
    const um = UM - mu, vt = VT - mu, vb = VB + mu, zmax = ZMAX - mz, zmin = ZMIN + mz;
    let fx = 0, fy = 0, fz = 0;
    if (u > um) fx = -(u - um) * zc; else if (u < -um) fx = -(u + um) * zc;
    if (v > vt) fy = -(v - vt) * zc; else if (v < vb) fy = -(v - vb) * zc;
    if (zc > zmax) fz = -(zc - zmax); else if (zc < zmin) fz = (zmin - zc) * 2;
    frX = 5 * fx; frY = 5 * (fy * ct + fz * st); frZ = 5 * (-fy * st + fz * ct);
    const fm = Math.hypot(frX, frY, frZ);
    if (fm > FRAME_CAP) { frX *= FRAME_CAP / fm; frY *= FRAME_CAP / fm; frZ *= FRAME_CAP / fm; }
  }

  let pol = 0, pvx = 0, pvy = 0, pvz = 0, nn = 0, outside = 0;
  for (let i = 0; i < N; i++) {
    const x = px[i], y = py[i], z = pz[i], vxi = vx[i], vyi = vy[i], vzi = vz[i];
    const spd = Math.hypot(vxi, vyi, vzi) + 1e-4;

    let nb = 0;                                // K nearest, insertion-sorted
    for (let j = 0; j < N; j++) {
      if (j === i) continue;
      const dx = px[j] - x, dy = py[j] - y, dz = pz[j] - z, d2 = dx * dx + dy * dy + dz * dz;

    }

    }

      const dx = gcx - x, dy = gcy - y, dz = gcz - z, d = Math.hypot(dx, dy, dz) + 1e-4;   // rejoin
      aX += W_GLOBAL * dx; aY += W_GLOBAL * dy; aZ += W_GLOBAL * dz;
      if (d > R_FLOCK) {
        // Velocity matching, not a central pull: a split-off group under a central force at the
        // acceleration cap just orbits the flock (radius v²/a_max ≈ 56 u at top speed). Matching the
        // flock's velocity plus a component toward its centre removes the tangential motion instead.
        const w = Math.min(1, (d - R_FLOCK) / R_FLOCK), s = .8 * CRUISE * w / d;

        aZ += W_REJOIN * w * (gvz + dz * s - vzi);
      }
    }

    {                                          // drive toward the roost; the turn ripples back from the front.
      // The drive direction is measured from the flock centre, not from each bird, so a wide flock
      // is not fanned out by the geometry of a shared target: that fan was the largest source of
      // disorder and pushed Φ far below the observed 0.96.
      const lag = clamp(1.2 - ((x - gcx) * way.hx + (y - gcy) * way.hy + (z - gcz) * way.hz) / 25, 0, 2.4);
      let e = clamp((t - way.t - lag) / 1.2, 0, 1); e = e * e * (3 - 2 * e);
      let tx = way.ox + (way.x - way.ox) * e, ty = way.oy + (way.y - way.oy) * e, tz = way.oz + (way.z - way.oz) * e;
      if (lure > .01) { tx += (tgt.x - tx) * lure; ty += (tgt.y - ty) * lure; tz += (tgt.z - tz) * lure; }
      // Only the part across the flock's heading is applied, and it does not depend on the bird's own
      // velocity: it turns the flock without pulling each heading toward a preferred direction. A
      // push along the heading is balanced by the speed hold, and together they act on every bird as
      // an aligning field of rate W_TGT/CRUISE, which cuts the correlation length to ~√(D/rate) ≈ 3 m.
      const dx = tx - gcx, dy = ty - gcy, dz = tz - gcz, d = Math.hypot(dx, dy, dz) + 1e-4;
      const k = W_TGT * (1 + .8 * lure) * clamp(d / 30, .4, 1) / d, al = dx * hx + dy * hy + dz * hz;
      aX += (dx - al * hx) * k; aY += (dy - al * hy) * k; aZ += (dz - al * hz) * k;
    }

    {                                          // hold cruise speed, fly mostly level, behavioural noise
      // Speed and climb are held for the flock as a whole (mean speed, mean vertical velocity). Each
      // bird's own speed is confined only marginally, by a quartic well with no linear stiffness at
      // CRUISE, so speed fluctuations are passed between neighbours instead of being damped in place.
      const ds = CRUISE - spd, s = (W_SPD * (CRUISE - gsp) + W_SPD4 * ds * ds * ds) / spd;
      aX += vxi * s; aY += vyi * s - W_LEVEL * gvy; aZ += vzi * s;
      nzx[i] = nzx[i] * ouDecay + ouKick * gauss();
      nzy[i] = nzy[i] * ouDecay + ouKick * gauss();
      nzz[i] = nzz[i] * ouDecay + ouKick * gauss();
      aX += nzx[i]; aY += .5 * nzy[i]; aZ += nzz[i];
    }

    let fear = 0;
    if (fal.on) {
      const dx = x - fal.x, dy = y - fal.y, dz = z - fal.z, d = Math.hypot(dx, dy, dz) + 1e-4;
      if (d < R_FLEE) {

const motionParts = Object.fromEntries(Object.entries(Motion.data.species).map(([name, model]) => [name, farParts(model)]));
function faceArea(a, b, c) {
  return (motionX[b] - motionX[a]) * (motionY[c] - motionY[a]) - (motionY[b] - motionY[a]) * (motionX[c] - motionX[a]);
}
function appendFaces(path, faces) {
  for (const face of faces) {
    const a = face[0], b = face[1], c = face[2], positive = faceArea(a, b, c) >= 0;
    path.moveTo(motionX[a], motionY[a]);
    path.lineTo(motionX[positive ? b : c], motionY[positive ? b : c]);
    path.lineTo(motionX[positive ? c : b], motionY[positive ? c : b]); path.closePath();
  }
}
function appendLoop(path, vertices) {
  let area = 0;
  for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i++) area += motionX[vertices[j]] * motionY[vertices[i]] - motionX[vertices[i]] * motionY[vertices[j]];
  const n = vertices.length;
  for (let i = 0; i < n; i++) {
    const v = vertices[area >= 0 ? i : n - 1 - i];
    if (i) path.lineTo(motionX[v], motionY[v]); else path.moveTo(motionX[v], motionY[v]);
  }
  path.closePath();
}
function appendFar(path, parts) {
  for (const part of parts) {
    if (part.hull) {
      const sorted = part.sorted, chain = part.chain;
      sorted.sort((a, b) => motionX[a] - motionX[b] || motionY[a] - motionY[b]); chain.length = 0;
      for (const v of sorted) {
        while (chain.length >= 2 && faceArea(chain[chain.length - 2], chain[chain.length - 1], v) <= 0) chain.pop();
        chain.push(v);
      }
      const lower = chain.length;
      for (let j = sorted.length - 2; j >= 0; j--) {
        const v = sorted[j];
        while (chain.length > lower && faceArea(chain[chain.length - 2], chain[chain.length - 1], v) <= 0) chain.pop();
        chain.push(v);
      }
      chain.pop(); appendLoop(path, chain);
    } else {
      let positive = false, negative = false;
      for (const face of part.faces) {
        const area = faceArea(face[0], face[1], face[2]); positive ||= area > 1e-9; negative ||= area < -1e-9;
      }
      // A folded sheet can overlap itself in projection. Keep its triangles in that case.
      if (positive && negative) appendFaces(path, part.faces); else appendLoop(path, part.boundary);
    }
  }
}
function pushMotion(path, species, state, x, y, z, fx, fy, fz, bk, scale, span) {
  P(x, y, z);
  const model = Motion.data.species[species], lod = f * span * scale / _z > 26 ? 'near' : 'far';
  const indices = model.indices[lod];
  if (species === 'starling') Motion.sampleGait(state, motionVertices, indices);
  else Motion.sampleFalcon(state, motionVertices, indices);
  birdFrame(x, y, z, fx, fy, fz, bk, 0, scale, span, span * .5);
  for (const vi of indices) {
    const j = vi * 3, a = motionVertices[j] * bL, w = motionVertices[j + 1] * bH, h = motionVertices[j + 2] * bH;
    P(bX + bFx * a + bRx * w + bNx * h, bY + bFy * a + bRy * w + bNy * h, bZ + bFz * a + bRz * w + bNz * h);
    motionX[vi] = _x; motionY[vi] = _y;
  }
  if (lod === 'far' && motionParts[species]) appendFar(path, motionParts[species]);
  else appendFaces(path, model.faces[lod]);
}

const fills = Array.from({ length: NB }, () => null), bodies = Array.from({ length: NB }, () => null);

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = fresh ? 1 : TRAIL; fresh = false;
  ctx.drawImage(sky, 0, 0, W, H);
  ctx.globalAlpha = 1;

  for (let b = 0; b < NB; b++) { fills[b] = new Path2D(); bodies[b] = new Path2D(); }
  for (let i = 0; i < N; i++) {
    P(px[i], py[i], pz[i]);
    if (_z < 10) continue;
    const b = clamp(((_z - ZMIN) / (ZMAX - ZMIN) * NB) | 0, 0, NB - 1);
    const s = 1 / Math.hypot(vx[i], vy[i], vz[i]);
    if (legacyMotion) {
      const p = pw[i], bound = pkind[i] === 2;
      const th = (-.05 + .78 * Math.cos(phase[i])) * (1 - p) + (bound ? 0 : .1) * p;
      const flex = Math.max(0, -Math.sin(phase[i]));
      pushBird(fills[b], bodies[b], px[i], py[i], pz[i], vx[i] * s, vy[i] * s, vz[i] * s, bank[i] + waveRoll(i), th, flex, size[i] * sizeK, SPAN, p, bound ? STARLING.bound : STARLING.glide);
    } else pushMotion(fills[b], 'starling', gaits[i], px[i], py[i], pz[i], vx[i] * s, vy[i] * s, vz[i] * s, bank[i] + waveRoll(i), size[i] * sizeK, SPAN);
  }
  ctx.lineCap = 'round';
  for (let b = NB - 1; b >= 0; b--) {
    ctx.fillStyle = ctx.strokeStyle = fillCol[b];
    ctx.lineWidth = lineW[b] * Math.max(.8, f / 1272);
    ctx.fill(fills[b]); ctx.stroke(bodies[b]);
  }

  if (fal.on) {
    const s = 1 / Math.hypot(fal.vx, fal.vy, fal.vz);
    const dive = clamp(-fal.vy * s * 2, 0, 1);
    const fp = [new Path2D(), new Path2D(), new Path2D()];           // right wing, left wing, body
    if (legacyMotion) pushFalcon(fp, fal.x, fal.y, fal.z, fal.vx * s, fal.vy * s, fal.vz * s, .2 + .5 * Math.sin(fal.phase) * fal.flap * (1 - dive), FALCON_SPAN * sizeK, dive, fal.fan * (1 - dive));
    else pushMotion(fp[0], 'falcon', fal.motion, fal.x, fal.y, fal.z, fal.vx * s, fal.vy * s, fal.vz * s, fal.motionBank, sizeK, FALCON_SPAN);
    ctx.fillStyle = ctx.strokeStyle = '#170a10'; ctx.lineWidth = Math.max(.8, f / 1272); ctx.lineJoin = 'round';
    for (const part of fp) { ctx.fill(part); if (legacyMotion) ctx.stroke(part); }
  }

  if (showPanel) drawPanel();
}

// Correlation panel, laid out like Fig 2A/B of the paper: C(r) (orientation, red) and C_sp(r)
// (speed, blue) against distance r up to the flock size L, with the zero crossings ξ marked.
let showPanel = params.has('stats') || params.has('debug');
const FONT = '11px ui-monospace, Menlo, monospace';
const fmt = (v, d = 1) => Number.isFinite(v) ? v.toFixed(d) : '—';
function drawPanel() {
  const pw = 380, ph = 262, pad = 12, x0 = W - pw - 14, y0 = 14;
  const gx = x0 + 34, gy = y0 + 24, gw = pw - 34 - pad, gh = 108;
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,20,.72)';
  ctx.beginPath(); ctx.roundRect(x0, y0, pw, ph, 8); ctx.fill();
  ctx.font = FONT; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,238,220,.9)'; ctx.textAlign = 'left';
  ctx.fillText('CORRELATION  C(r)  ·  Cavagna et al. 2010', x0 + pad, y0 + 11);

  const Y = c => gy + gh * (1 - (clamp(c, -1, 1) + 1) / 2);
  ctx.strokeStyle = 'rgba(255,238,220,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(gx, Y(1)); ctx.lineTo(gx, Y(-1)); ctx.lineTo(gx + gw, Y(-1)); ctx.stroke();
  ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(gx, Y(0)); ctx.lineTo(gx + gw, Y(0)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,238,220,.55)'; ctx.textAlign = 'right';
  ctx.fillText('1', gx - 5, Y(1)); ctx.fillText('0', gx - 5, Y(0)); ctx.fillText('-1', gx - 5, Y(-1));

  if (corr.samples) {
    const X = r => gx + gw * r / corr.L;
    const series = (C, col) => {
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.2; ctx.beginPath();
      let first = true;
      for (let b = 0; b < NBIN; b++) {
        if (Number.isNaN(C[b])) continue;
        const sx = X((b + .5) * corr.dr), sy = Y(C[b]);
        if (first) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); first = false;
      }
      ctx.stroke();
      for (let b = 0; b < NBIN; b++) if (!Number.isNaN(C[b])) { ctx.beginPath(); ctx.arc(X((b + .5) * corr.dr), Y(C[b]), 1.8, 0, TAU); ctx.fill(); }
    };
    const xiMark = (xi, col) => {
      if (!Number.isFinite(xi)) return;
      ctx.strokeStyle = col; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(xi), Y(1)); ctx.lineTo(X(xi), Y(-1)); ctx.stroke(); ctx.setLineDash([]);
    };
    series(corr.Csp, 'rgba(96,150,240,.9)'); series(corr.C, 'rgba(240,86,74,.95)');
    xiMark(corr.xiSp, 'rgba(96,150,240,.6)'); xiMark(corr.xi, 'rgba(240,86,74,.7)');

    ctx.fillStyle = 'rgba(255,238,220,.55)'; ctx.textAlign = 'center';
    ctx.fillText('0', gx, gy + gh + 9); ctx.fillText(`r  (m)`, gx + gw / 2, gy + gh + 9); ctx.fillText(fmt(corr.L * M, 0), gx + gw, gy + gh + 9);

    const ty = gy + gh + 26, lh = 15;
    const line = (i, label, val, col) => {
      ctx.textAlign = 'left'; ctx.fillStyle = col || 'rgba(255,238,220,.6)'; ctx.fillText(label, x0 + pad, ty + i * lh);
      ctx.textAlign = 'right'; ctx.fillStyle = col || 'rgba(255,238,220,.92)'; ctx.fillText(val, x0 + pw - pad, ty + i * lh);
    };
    line(0, `N ${N}   L flock size`, `${fmt(corr.L * M)} m`);
    line(1, 'Φ polarization (Eq 1) · paper 0.96', `${fmt(corr.phi, 3)}  ⟨${fmt(corr.avgPhi, 3)}⟩`);
    line(2, 'speed  ⟨|v|⟩ ± σ   ·   |u| rms', `${fmt(corr.speed * M)} ± ${fmt(corr.sigSpeed * M)}   ${fmt(corr.rmsU * M)} m/s`);
    line(3, 'ξ orientation · paper ξ/L 0.35', `${fmt(corr.xi * M)} m   ξ/L ${fmt(corr.xi / corr.L, 2)} ⟨${fmt(corr.avgXiL, 2)}⟩`, 'rgba(240,120,110,.95)');
    line(4, 'ξ speed · paper ξ/L 0.36', `${fmt(corr.xiSp * M)} m   ξ/L ${fmt(corr.xiSp / corr.L, 2)} ⟨${fmt(corr.avgXiSpL, 2)}⟩`, 'rgba(130,170,245,.95)');
    line(5, 'nearest neighbour · noise', `${fmt(stats.nn * M, 2)} m   ${fmt(NOISE_K, 2)}×`);
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,238,220,.38)';
    ctx.fillText('C to hide · ?noise= ?n= ?seed=', x0 + pad, ty + 6 * lh);
  } else {
    ctx.fillStyle = 'rgba(255,238,220,.5)'; ctx.textAlign = 'left'; ctx.fillText('sampling…', gx, gy + gh / 2);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- input, loop
addEventListener('resize', layout);
addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; lastMove = performance.now();
}, { passive: true });
addEventListener('pointerdown', e => {
  if (e.target?.closest?.('a')) return;
  ptr.x = e.clientX; ptr.y = e.clientY; lastMove = performance.now();
  launchFalcon(e.clientX, e.clientY);
});
addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') showPanel = !showPanel; });

document.getElementById('hint').textContent = `${N} starlings · move to lure · click to loose a falcon · C for correlations`;
setTimeout(() => document.getElementById('hud').classList.add('dim'), 9000);

layout();
initFlock();
for (let i = 0; i < N; i++) gaits.push(Motion.gait(i, phase[i] / TAU, (freq[i] - BEAT_HZ[0]) / (BEAT_HZ[1] - BEAT_HZ[0])));

let simT = 0;
const warm = +params.get('warm') || 0;
for (let s = 0; s < warm * 60; s++) { simT += 1 / 60; step(1 / 60, simT); }
if (params.has('falcon')) launchFalcon(null);

let dbg = null;
if (params.has('debug')) {
  dbg = document.createElement('pre'); dbg.id = 'dbg'; document.body.appendChild(dbg);
  window.murm = { step, analyse, draw, stats, corr, px, py, pz, vx, vy, vz, N, M, fal, huntLog, alarm, wT, wL, wP,
    gaits, Motion, motionMode: legacyMotion ? 'legacy' : 'xyz', motionAssets, motionExports, revision, seed, launchFalcon, pushMotion,
    get gc() { return [gcx, gcy, gcz]; }, get simT() { return simT; },
    cam: { get UM() { return UM; }, get VT() { return VT; }, get VB() { return VB; }, get ct() { return ct; }, get st() { return st; }, CAM_H, ZMIN, ZMAX } };
}

const ANALYSE_EVERY = N > 1500 ? 1 : .5;       // seconds of simulated time between O(N²) correlation passes
let last = performance.now() / 1000, frames = 0, fpsT = 0, fps = 0;
function loop(ms) {
  const now = ms / 1000, elapsed = now - last, dt = Math.min(elapsed, 1 / 30); last = now;
  if (dt > 0) { simT += dt; step(dt, simT); }
  if (showPanel && simT - corr.t >= ANALYSE_EVERY) analyse(simT);
  draw();
  if (dbg) {
    frames++; fpsT += elapsed;
    if (fpsT > .5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
    const inputs = Object.entries(motionAssets).flatMap(([species, files]) => Object.entries(files).map(([file, hash]) => `${species}/${file}:${hash.slice(0, 12)}`));
    const exports = Object.entries(motionExports).map(([file, hash]) => `${file}:${hash.slice(0, 12)}`);
    dbg.textContent = `base ${revision.base.slice(0, 12)}  seed ${seed}  motion ${legacyMotion ? 'legacy' : 'xyz'}  worktree ${revision.worktree}\nexports ${exports.join('  ')}\ninputs ${inputs.join('  ')}\nt ${simT.toFixed(1)}  fps ${fps.toFixed(0)}  pol ${stats.pol.toFixed(2)}  nn ${stats.nn.toFixed(1)}  out ${stats.out}  falcon ${fal.on ? `${fal.mode}/${fal.motion.pose}` : 'off'}`;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
